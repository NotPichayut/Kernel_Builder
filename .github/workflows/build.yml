name: Kernel build workflow

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      # ==================== Basic configuration ====================
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      display_sub:
        description: "Display subversion for LTS builds (maintained by the data pipeline; used only for run/job naming)"
        required: false
        type: string
        default: ""
      os_patch_level:
        required: true
        type: string

      # ==================== KernelSU configuration ====================
      ksu_variant:
        required: true
        type: string
      build_channel:
        description: "Build channel: Official (Release) aligns with the official release; Latest (HEAD) follows the latest upstream commit (label and summary only)"
        required: false
        type: string
        default: "Official (Release)"
      ksu_commit:
        description: "BakaSU only: check out KernelSU at this commit to align with the latest officially uploaded build (leave blank to follow main HEAD)"
        required: false
        type: string
        default: ""
      ksu_cert_size:
        description: "FinaSU only: manager signing certificate DER size (0x hexadecimal; used to align the second trust slot)"
        required: false
        type: string
        default: ""
      ksu_cert_hash:
        description: "FinaSU only: manager signing certificate SHA256 (used to align the second trust slot)"
        required: false
        type: string
        default: ""

      # ==================== Optional configuration ====================
      version:
        required: false
        type: string
      revision:
        required: false
        type: string
        default: "r1"
      build_time:
        required: false
        type: string
        default: ""

      # ==================== Feature toggles ====================
      use_zram:
        required: true
        type: boolean
        default: true
      use_bbg:
        required: true
        type: boolean
        default: true
      use_net_enhance:
        required: true
        type: boolean
        default: false
      use_kpm:
        required: true
        type: string
        default: "disabled (off)"
      use_rekernel:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      enable_susfs:
        required: true
        type: boolean
        default: true
      supp_op:
        required: false
        type: boolean
        default: false
      droidspaces:
        required: false
        type: string
        default: "off"
      artifact_upload_mode:
        required: false
        type: string
        default: "Upload all"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      skip_incompatible:
        description: "Automatically skip features that are incompatible or unavailable (without interrupting the build)"
        required: false
        type: boolean
        default: false

jobs:
  build-kernel:
    name: "${{ inputs.kernel_version }}.${{ inputs.display_sub || inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}-${{ inputs.ksu_variant }}"
    runs-on: ubuntu-latest
    # repo sync retries (3 x 20 minutes) + allow at least 60 minutes for a complete build
    timeout-minutes: 90

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      SKIP_INCOMPATIBLE: ${{ inputs.skip_incompatible }}

    steps:
      - name: Build information summary
        run: |
          echo "========================================"
          echo "       Kernel build configuration summary"
          echo "========================================"
          echo "Android version  : ${{ inputs.android_version }}"
          echo "Kernel version      : ${{ inputs.kernel_version }}"
          echo "Subversion      : ${{ inputs.sub_level }}"
          echo "patch level      : ${{ inputs.os_patch_level }}"
          echo "KSU variant      : ${{ inputs.ksu_variant }}"
          echo "Build channel      : ${{ inputs.build_channel }}"
          echo "Build time      : ${{ inputs.build_time }}"
          echo "SUSFS status    : ${{ inputs.enable_susfs }}"
          echo "ZRAM compression     : ${{ inputs.use_zram }}"
          echo "BBG patch      : ${{ inputs.use_bbg }}"
          echo "network enhancements      : ${{ inputs.use_net_enhance }}"
          echo "KPM feature      : ${{ inputs.use_kpm }}"
          echo "Re-Kernel     : ${{ inputs.use_rekernel }}"
          echo "CVE-2026-43499: ${{ inputs.cve_2026_43499_patch }}"
          echo "Droidspaces   : ${{ inputs.droidspaces }}"
          echo "NTSync        : ${{ inputs.droidspaces_ntsync }}"
          echo "Compatibility skip      : ${{ inputs.skip_incompatible }}"
          echo "Artifact upload mode  : ${{ inputs.artifact_upload_mode }}"
          echo "========================================"

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: Check out source repository
        uses: actions/checkout@v7

      - name: Initialize build environment
        run: |
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
          KERNEL_ROOT="$GITHUB_WORKSPACE/$CONFIG"
          mkdir -p "$KERNEL_ROOT"

          cat >> $GITHUB_ENV << EOF
          CONFIG=$CONFIG
          KERNEL_ROOT=$KERNEL_ROOT
          DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig
          SUSFS4KSU=$GITHUB_WORKSPACE/susfs4ksu
          KERNEL_PATCHES=$GITHUB_WORKSPACE/kernel_patches
          SUKISU_PATCHES=$GITHUB_WORKSPACE/SukiSU_patch
          ZZH_PATCHES=$GITHUB_WORKSPACE
          ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3
          ACTION_BUILD=$GITHUB_WORKSPACE/Action-Build
          AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool
          MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py
          UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py
          BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem
          EOF

          mkdir -p "$GITHUB_WORKSPACE/git-repo"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"
          echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV

      - name: Show configuration
        run: |
          CONFIG_FILE="$GITHUB_WORKSPACE/config/config"
          if [ -f "$CONFIG_FILE" ]; then
            echo "Loading config file: $CONFIG_FILE"
            cat "$CONFIG_FILE"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache python3 git curl build-essential libssl-dev bison flex libelf-dev dwarves lz4

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Restore ccache cache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-

      # Only 6.1+ uses bazel builds; persist the --disk_cache directory to accelerate subsequent builds
      - name: Restore bazel disk cache
        if: inputs.android_version != 'android12' && inputs.android_version != 'android13'
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel
          key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-bazel-${{ github.sha }}
          restore-keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-bazel-
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-bazel-
          
      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: |
            kernel-build-tools
            mkbootimg
          key: toolchain-${{ runner.os }}-v1

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          AOSP_MIRROR=https://android.googlesource.com
          BRANCH=main-kernel-build-2024
          git clone $AOSP_MIRROR/kernel/prebuilts/build-tools -b $BRANCH --depth 1 kernel-build-tools
          git clone $AOSP_MIRROR/platform/system/tools/mkbootimg -b $BRANCH --depth 1 mkbootimg

      - name: Generate signing key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 > $BOOT_SIGN_KEY_PATH

      - name: Configure Git
        run: |
          git config --global user.name "BuildBot"
          git config --global user.email "BuildGkiKernel@gmail.com"
          # Upstream Git connections occasionally stall; abort if the transfer rate stays below 1 KB/s for 180 seconds,
          # to avoid an indefinite hang during repo sync / git clone until the job times out
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 180

      - name: Clone dependency repositories
        run: |
          ANYKERNEL_BRANCH="gki-2.0"
          SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"

          echo "Clone AnyKernel3..."
          git clone https://github.com/WildKernels/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          rm -rf AnyKernel3/.git

          echo "Clone SUSFS (branch: $SUSFS_BRANCH)..."
          if [ "${{ inputs.ksu_variant }}" == "SukiSU" ]; then
            if ! git clone https://github.com/ShirkNeko/susfs4ksu.git -b "$SUSFS_BRANCH" 2>/dev/null; then
              echo "Branch $SUSFS_BRANCH not found in the ShirkNeko repository; falling back to the original simonpunk repository..."
              git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
            fi
          else
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          fi

          CONFIG_FILE="config/config"
          if [ -f "$CONFIG_FILE" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" "$CONFIG_FILE" | cut -d'=' -f2)
            if [ "$CUSTOM_ENABLED" == "true" ]; then
              CUSTOM_COMMIT=$(grep "^${SUSFS_BRANCH}=" "$CONFIG_FILE" | cut -d'=' -f2)
              if [ -n "$CUSTOM_COMMIT" ]; then
                echo "Switch SUSFS to custom commit: $CUSTOM_COMMIT"
                cd susfs4ksu
                git checkout "$CUSTOM_COMMIT"
                cd ..
              fi
            fi
          fi

          SUSFS_LATEST_COMMIT_DATE=$(git -C susfs4ksu log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
          echo "SUSFS_LATEST_COMMIT_DATE=$SUSFS_LATEST_COMMIT_DATE" >> $GITHUB_ENV
          echo "Latest commit date in the SUSFS repository:  $SUSFS_LATEST_COMMIT_DATE"

          echo "Prepare patch resources..."
          git clone https://github.com/WildKernels/kernel_patches.git
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          echo "Using the current repository patch directory: $ZZH_PATCHES"
          git clone https://github.com/Numbersf/Action-Build.git --depth=1

      - name: Initialize and sync kernel source
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1.git gcc

          FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
          echo "Initialize repo, branch: common-${FORMATTED_BRANCH}"

          $REPO init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-${FORMATTED_BRANCH} --repo-rev=v2.16

          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml

          if grep -q deprecated <<< $REMOTE_BRANCH; then
            echo "Deprecated branch detected: $FORMATTED_BRANCH"
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
          elif [[ -z "$REMOTE_BRANCH" ]]; then
            echo "Branch ${FORMATTED_BRANCH} was deleted upstream; falling back to the latest ASB tag for that month"
            LATEST_R=$(git ls-remote https://android.googlesource.com/kernel/common "refs/tags/${FORMATTED_BRANCH}_r*" \
              | grep -v '\^{}' \
              | sed 's/.*_r//' \
              | sort -n | tail -1)
            if [[ -z "$LATEST_R" ]]; then
              echo "::error::Neither the upstream branch nor the monthly tag exists: ${FORMATTED_BRANCH}"
              exit 1
            fi
            LATEST_TAG="${FORMATTED_BRANCH}_r${LATEST_R}"
            echo "Using tag:  ${LATEST_TAG}"
            REMOTE_BRANCH="refs/tags/${LATEST_TAG}"
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"refs\/tags\/${LATEST_TAG}\"/g" $DEFAULT_MANIFEST_PATH
          fi

          # repo sync supports resuming: limit each attempt to 20 minutes; after a timeout or failure, clean up leftover processes and retry,
          # Projects already synced are automatically skipped on the next attempt；to prevent a stalled upstream connection from consuming the entire job timeout
          SYNC_OK=false
          for SYNC_ATTEMPT in 1 2 3; do
            echo "==> repo sync # ${SYNC_ATTEMPT}/3 timeattempt"
            if timeout --kill-after=30 20m $REPO --trace sync -c -j$(nproc --all) --no-tags --fail-fast; then
              SYNC_OK=true
              break
            fi
            echo "::warning title=repo sync retry::Attempt ${SYNC_ATTEMPT}/3 failed or timed out，clean up residual git processes and retry"
            pkill -9 -f 'git-remote-https' 2>/dev/null || true
            pkill -9 -f 'android\.googlesource\.com' 2>/dev/null || true
            sleep 10
          done
          if [ "$SYNC_OK" != "true" ]; then
            echo "::error::repo sync failed on all 3 attempts (upstream connection stalled or unavailable)"
            exit 1
          fi
          echo "REMOTE_BRANCH=$REMOTE_BRANCH" >> $GITHUB_ENV

      - name: Extract actual subversion number
        run: |
          ACTUAL_SUBLEVEL="${{ inputs.sub_level }}"
          if [[ -f "$KERNEL_ROOT/common/Makefile" ]]; then
            EXTRACTED=$(grep '^SUBLEVEL = ' "$KERNEL_ROOT/common/Makefile" | awk '{print $3}')
            [[ -n "$EXTRACTED" ]] && ACTUAL_SUBLEVEL="$EXTRACTED"
          fi
          echo "ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL" >> $GITHUB_ENV
          echo "Actual subversion number: $ACTUAL_SUBLEVEL"
          if [[ "${{ inputs.sub_level }}" == "X" ]]; then
            CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${ACTUAL_SUBLEVEL}"
            echo "CONFIG=$CONFIG" >> $GITHUB_ENV
            NAME_SUBLEVEL="$ACTUAL_SUBLEVEL"
            echo "LTS build: use the actual subversion number for artifact naming $ACTUAL_SUBLEVEL"
          else
            NAME_SUBLEVEL="${{ inputs.sub_level }}"
          fi
          echo "NAME_SUBLEVEL=$NAME_SUBLEVEL" >> $GITHUB_ENV

      # Use the actual synchronized SUBLEVEL to avoid reapplying patches to LTS builds that already contain the upstream fix
      - name: Automatically apply the CVE-2026-43499 rtmutex fix series
        if: inputs.cve_2026_43499_patch
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          if ! bash "$GITHUB_WORKSPACE/security_patch/apply_cve_2026_43499.sh" \
            "${{ inputs.kernel_version }}" \
            "$ACTUAL_SUBLEVEL" \
            "$GITHUB_WORKSPACE/security_patch"; then
            if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
              echo "::warning title=CVE-2026-43499 skipped::Fix series application failed (may be incompatible with the current kernel subversion); skipped this feature and continued the build"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **CVE-2026-43499 fix series** automatically skipped: fix series application failed (may be incompatible with the current kernel subversion) (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "CVE_SKIPPED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::CVE-2026-43499 fix series application failed"
            exit 1
          fi

      - name: Fix glibc 2.38 compatibility
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          RAW_SUB="${{ inputs.sub_level }}"
          [[ ! "$RAW_SUB" =~ ^[0-9]+$ ]] && CURRENT_SUB=99999 || CURRENT_SUB=$RAW_SUB

          NEEDS_FIX=false
          if [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.10" && $CURRENT_SUB -le 186 ]] ||
             [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" && $CURRENT_SUB -le 119 ]] ||
             [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "6.1" && $CURRENT_SUB -le 43 ]]; then
            NEEDS_FIX=true
          fi

          if [ "$NEEDS_FIX" = true ]; then
            GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}')
            if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then
              echo "Apply glibc 2.38 compatibility fix..."
              sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile 2>/dev/null || true

              if [[ "${{ inputs.kernel_version }}" == "5.10" || "${{ inputs.kernel_version }}" == "5.15" ]]; then
                sed -i '/char \*buf = NULL;/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++) {/for (i = 0; subcommands[i]; i++) {/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i '/if (subcommands) {/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++)/for (i = 0; subcommands[i]; i++)/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              fi
            fi
          fi

      - name: Add OnePlus Snapdragon 8 Elite/Gen5 processor support
        if: inputs.supp_op
        working-directory: ${{ env.KERNEL_ROOT }}/common/drivers
        run: |
          echo "Using hmbird_patch.c from this repository..."
          cp "$GITHUB_WORKSPACE/hmbird_patch.c" ./hmbird_patch.c
          echo "obj-y += hmbird_patch.o" >> Makefile

      - name: Determine KernelSU branch
        id: ksu-branch
        run: |
          variant_input="${{ inputs.ksu_variant }}"

          case "$variant_input" in
            "BakaSU")
              BRANCH="-s main"
              ;;
            "FinaSU")
              BRANCH="-s master"
              ;;
            "SukiSU")
              if [ "${{ inputs.enable_susfs }}" = "false" ]; then
                BRANCH="-s main"
              else
                BRANCH="-s builtin"
              fi
              ;;
            *)
              echo "Unknown variant: $variant_input" >&2
              exit 1
              ;;
          esac

          # Check custom commit (applies to SukiSU only)
          CONFIG_FILE="config/config"
          if [ -f "$CONFIG_FILE" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" "$CONFIG_FILE" | cut -d'=' -f2)
            if [ "$CUSTOM_ENABLED" == "true" ] && [ "$variant_input" == "SukiSU" ]; then
              SUKISU_COMMIT=$(grep "^sukisu=" "$CONFIG_FILE" | cut -d'=' -f2)
              if [ -n "$SUKISU_COMMIT" ]; then
                BRANCH="-s $SUKISU_COMMIT"
                echo "SukiSU using custom commit: $SUKISU_COMMIT"
              fi
            fi
          fi

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "KSU branch: $BRANCH"

      - name: Add KernelSU
        working-directory: ${{ env.KERNEL_ROOT }}
        env:
          KSU_COMMIT: ${{ inputs.ksu_commit }}
          KSU_CERT_SIZE: ${{ inputs.ksu_cert_size }}
          KSU_CERT_HASH: ${{ inputs.ksu_cert_hash }}
        run: |
          case "${{ inputs.ksu_variant }}" in
            "SukiSU")
              echo "Adding ${{ inputs.ksu_variant }}..."
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash $BRANCH
              # Align the kernel-side KSU version source with the latest officially uploaded Manager build:
              # SukiSU version = 40000 + number of commits in the branch pointed to by REPO_BRANCH - 2815
              #(main branch is defined in kernel/Kbuild; builtin branch is defined in kernel/Makefile,
              #  prefer the GitHub API, falling back to local rev-list). Rewrite REPO_BRANCH to the official
              # build commit to ensure the kernel KSU version exactly matches the fetched manager package
              if [ -n "$KSU_COMMIT" ] && [ "$BRANCH" != "-s main" ] && [ "$BRANCH" != "-s builtin" ]; then
                echo "SukiSU uses a custom commit ($BRANCH); skipping manager version alignment"
              elif [ -n "$KSU_COMMIT" ]; then
                if ! git -C KernelSU fetch origin "$KSU_COMMIT" 2>/dev/null; then
                  echo "Official build commit $KSU_COMMIT is already in the local clone; skipping fetch"
                fi
                if ! git -C KernelSU cat-file -e "$KSU_COMMIT^{commit}" 2>/dev/null; then
                  echo "::error::Official build commit $KSU_COMMIT is not in the KernelSU repository; unable to align the version source"
                  exit 1
                fi
                if [ "$BRANCH" = "-s builtin" ]; then
                  KSU_VERSION_SOURCE="KernelSU/kernel/Makefile"
                else
                  KSU_VERSION_SOURCE="KernelSU/kernel/Kbuild"
                fi
                if ! sed -i -E "s|^(REPO_BRANCH[[:space:]]*[:?+]?=)[[:space:]]*main[[:space:]]*\$|\1 $KSU_COMMIT|" "$KSU_VERSION_SOURCE"; then
                  echo "::error::Failed to rewrite REPO_BRANCH in $KSU_VERSION_SOURCE; unable to align with the manager version"
                  exit 1
                fi
                if ! grep -qE "^REPO_BRANCH[[:space:]]*[:?+]?=[[:space:]]*$KSU_COMMIT[[:space:]]*\$" "$KSU_VERSION_SOURCE"; then
                  echo "::error::Unable to align REPO_BRANCH in $KSU_VERSION_SOURCE (upstream structure may have changed); unable to align with the manager version"
                  exit 1
                fi
                echo "SukiSU kernel-side version source aligned to official uploaded build commit $KSU_COMMIT (KSU version $((40000 + $(git -C KernelSU rev-list --count "$KSU_COMMIT") - 2815)))"
              fi
              bash "$GITHUB_WORKSPACE/scripts/ksu_post_setup.sh" KernelSU sukisu
              ;;
            "BakaSU")
              echo "Adding BakaSU..."
              curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash $BRANCH
              # kernel-side KernelSU check out the same commit as the latest officially uploaded Manager build
              #（Kbuild calculates the version as 30700 + Git commit count, sharing the same source and value as the official manager versionCode），
              # Ensure the kernel KSU version exactly matches the fetched manager package
              if [ -n "$KSU_COMMIT" ]; then
                if ! git -C KernelSU checkout --detach "$KSU_COMMIT" 2>/dev/null; then
                  git -C KernelSU fetch origin "$KSU_COMMIT"
                  git -C KernelSU checkout --detach "$KSU_COMMIT"
                fi
                if [ "$(git -C KernelSU rev-parse HEAD)" != "$KSU_COMMIT" ]; then
                  echo "::error::KernelSU check outofficial build commit $KSU_COMMIT failed; unable toalign with the manager version"
                  exit 1
                fi
                echo "KernelSU checked out at the official uploaded build commit $KSU_COMMIT (KSU version $((30700 + $(git -C KernelSU rev-list --count HEAD))))"
              fi
              bash "$GITHUB_WORKSPACE/scripts/ksu_post_setup.sh" KernelSU bakasu
              ;;
            "FinaSU")
              echo "Adding ${{ inputs.ksu_variant }}..."
              git clone https://github.com/LyraVoid/FinaSU.git KernelSU
              # Check out the kernel-side source at the same commit as the latest official Release (ksuCommit from get-manager
              # resolved from the Release tag; Kbuild calculates the version as 30000 + Git commit count, matching the official
              # release manager versionCode; this ensures an exact match with the released manager
              if [ -n "$KSU_COMMIT" ]; then
                if ! git -C KernelSU checkout --detach "$KSU_COMMIT" 2>/dev/null; then
                  git -C KernelSU fetch origin "$KSU_COMMIT"
                  git -C KernelSU checkout --detach "$KSU_COMMIT"
                fi
                if [ "$(git -C KernelSU rev-parse HEAD)" != "$KSU_COMMIT" ]; then
                  echo "::error::KernelSU check outofficial build commit $KSU_COMMIT failed; unable toalign with the manager version"
                  exit 1
                fi
                echo "KernelSU checked out at the official uploaded build commit $KSU_COMMIT (KSU version $((30000 + $(git -C KernelSU rev-list --count HEAD))))"
              fi
              # FinaSU kernel/setup.sh still clones upstream tiann/KernelSU; handle this manually here
              # In-tree integration: symlink the driver directory and connect Makefile / Kconfig
              DRIVER_DIR="$KERNEL_ROOT/common/drivers"
              ln -sfn "$(realpath --relative-to="$DRIVER_DIR" "$KERNEL_ROOT/KernelSU/kernel")" "$DRIVER_DIR/kernelsu"
              grep -q "obj-.*CONFIG_KSU.*kernelsu/" "$DRIVER_DIR/Makefile" || \
                echo 'obj-$(CONFIG_KSU) += kernelsu/' >> "$DRIVER_DIR/Makefile"
              if ! grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig"; then
                sed -i "/endmenu/i source \"drivers/kernelsu/Kconfig\"" "$DRIVER_DIR/Kconfig"
              fi
              # SUSFS case: Upstream has integrated it natively in-tree; no driver-side patch is needed,
              # scripts/susfs_fixes/apply.sh validates and applies the kernel-side main patch

              # Inject the FinaSU official manager signing certificate into the kernel second trust slot（EXPECTED_SIZE2/HASH2）。
              # Without injection, the kernel trusts only the upstream KernelSU default slot, allowing the official KernelSU manager to take over
              # the manager identity, and FinaSU Manager displays "Not installed".
              if [ -z "$KSU_CERT_SIZE" ] || [ -z "$KSU_CERT_HASH" ]; then
                echo "Manager certificate was not passed by get-manager; falling back to extraction from the latest FinaSU Release APK..."
                REL_APK=$(mktemp -d)/manager.apk
                REL_JSON=""
                for ATTEMPT in 1 2 3; do
                  REL_JSON=$(curl -s --fail --max-time 30 \
                    "https://api.github.com/repos/LyraVoid/FinaSU/releases/latest") \
                    && [ -n "$REL_JSON" ] && break
                  echo "Failed to get Release information，retry ($ATTEMPT/3)..."
                  sleep 5
                done
                REL_URL=$(printf '%s' "$REL_JSON" | python3 -c \
                  "import json,sys; d=json.load(sys.stdin); print(next(a['browser_download_url'] for a in d.get('assets',[]) if a['name'].endswith('.apk')))" 2>/dev/null || true)
                if [ -z "$REL_URL" ]; then
                  echo "::error::Unable to get the FinaSU manager signing certificate: it was not passed by get-manager and the latest Release has no APK asset; the kernel will not recognize FinaSU Manager"
                  exit 1
                fi
                curl -sL --fail --retry 3 --max-time 300 -o "$REL_APK" "$REL_URL" || {
                  echo "::error::download FinaSU Release APK failed; unable toextractmanagersigning certificate"
                  exit 1
                }
                CERT_INFO=$(python3 "$GITHUB_WORKSPACE/scripts/finasu_compat/extract_manager_cert.py" "$REL_APK" | head -n1)
                KSU_CERT_SIZE=$(echo "$CERT_INFO" | awk '{print $1}')
                KSU_CERT_HASH=$(echo "$CERT_INFO" | awk '{print $2}')
              fi
              if [ -z "$KSU_CERT_SIZE" ] || [ -z "$KSU_CERT_HASH" ]; then
                echo "::error::Failed to extract the FinaSU manager signing certificate; the kernel will not recognize FinaSU Manager"
                exit 1
              fi
              echo "Inject FinaSU manager signing certificate into the kernel second trust slot: size=$KSU_CERT_SIZE sha256=$KSU_CERT_HASH"
              awk -v size="$KSU_CERT_SIZE" -v hash="$KSU_CERT_HASH" '
                !done && /^ccflags-y \+= -DEXPECTED_HASH=/ {
                  print
                  print "# injected by GKI_FinaSU_SUSFS: trust the official FinaSU manager via the second signature slot"
                  print "KSU_EXPECTED_SIZE2 := " size
                  print "KSU_EXPECTED_HASH2 := " hash
                  print "KSU_SECOND_SIGNATURE_RELEASE := 1"
                  done = 1
                  next
                }
                { print }
              ' KernelSU/kernel/Kbuild > KernelSU/kernel/Kbuild.new && mv KernelSU/kernel/Kbuild.new KernelSU/kernel/Kbuild
              grep -q "^KSU_EXPECTED_SIZE2 := " KernelSU/kernel/Kbuild \
                && grep -q "^KSU_EXPECTED_HASH2 := " KernelSU/kernel/Kbuild \
                && grep -q "^KSU_SECOND_SIGNATURE_RELEASE := 1" KernelSU/kernel/Kbuild \
                || { echo "::error::Kbuild injection failed (anchor line missing; FinaSU upstream Kbuild structure may have changed)"; exit 1; }
              # As with SukiSU/BakaSU, fix @<branch> in the full kernel version to the brand name
              # （CI checks out a detached commit, so abbrev-ref displays @HEAD）；
              # Must be called after the certificate injection above (rewriting Kbuild with awk)
              bash "$GITHUB_WORKSPACE/scripts/ksu_post_setup.sh" KernelSU finasu
              ;;
            *)
              echo "Unknown variant: ${{ inputs.ksu_variant }}" >&2
              exit 1
              ;;
          esac

          if [ -d "KernelSU/.git" ]; then
            KSU_LATEST_COMMIT_DATE=$(git -C KernelSU log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
            echo "KSU_LATEST_COMMIT_DATE=$KSU_LATEST_COMMIT_DATE" >> $GITHUB_ENV
          else
            echo "KSU_LATEST_COMMIT_DATE=unknown" >> $GITHUB_ENV
          fi

      # FinaSU kernel-side SUSFS integration is included in scripts/susfs_fixes/apply.sh:
      # Since 5b83330b (2026-10-23), upstream has integrated SUSFS natively in-tree, as with SukiSU/BakaSU
      # This is also a "no driver-side patch" approach; the "Apply SUSFS patches" step handles validation and application

      # SukiSU builtin branch (built-in + SUSFS product line) is independent of the main branch,
      # The official manager APK is always built from the main branch. When main raises
      # KERNEL_SU_UAPI_VERSION (for example, 3b60791 added UAPI 6
      # KSU_IOCTL_LOOKUP_SYMBOLS + KSU_GET_INFO_FLAG_PREINIT），builtin
      # If the checked-out kernel UAPI lags behind the manager, the home screen reports "Kernel update required"
      # （Natives.kt: managerUAPIVersion > kernelUAPIVersion）。
      # This step dynamically syncs missing constants/structures from uapi/supercall.h on official main
      # Port the original main content into the builtin checkout and raise the UAPI number; for UAPI >= 6, also
      # inject LOOKUP_SYMBOLS handling and symbol_resolver kernel-side capabilities;
      # Automatically skip once upstream builtin has synced itself; see scripts/ksu_uapi_sync/sync_uapi.sh
      - name: Sync SukiSU kernel UAPI version (align with official manager)
        if: inputs.ksu_variant == 'SukiSU'
        working-directory: ${{ env.KERNEL_ROOT }}
        run: bash "$GITHUB_WORKSPACE/scripts/ksu_uapi_sync/sync_uapi.sh" KernelSU

      # SukiSU builtin branch hook/lsm_hook.c still calls the old signature
      # security_add_hooks(hooks, count, "ksu")，6.8+ kernels require const struct lsm_id *，
      # Android 16 / 6.12 GKI builds fail directly。
      # The patch is guarded by LINUX_VERSION_CODE; kernel behavior is unchanged on 6.7 and below,
      # Automatically skip after the upstream SukiSU fix is detected by content。
      - name: Apply SukiSU kernel API compatibility patch (6.8+ lsm_id)
        if: inputs.ksu_variant == 'SukiSU'
        working-directory: ${{ env.KERNEL_ROOT }}
        run: bash "$GITHUB_WORKSPACE/scripts/sukisu_compat/apply.sh" KernelSU

      - name: Apply SUSFS patches
        if: inputs.enable_susfs
        working-directory: ${{ env.KERNEL_ROOT }}
        env:
          ANDROID_VERSION: ${{ inputs.android_version }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          KSU_VARIANT: ${{ inputs.ksu_variant }}
          OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
          SUB_LEVEL: ${{ inputs.sub_level }}
        run: bash "$GITHUB_WORKSPACE/scripts/susfs_fixes/apply.sh"
          
      - name: Clone Droidspaces patch repository
        if: inputs.droidspaces != 'off'
        run: |
          if git clone --depth 1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/Droidspaces-OSS; then
            echo "DROIDSPACES_PATCHES=/tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI" >> $GITHUB_ENV
          elif [ "$SKIP_INCOMPATIBLE" = "true" ]; then
            echo "::warning title=Droidspaces skipped::Failed to clone the Droidspaces patch repository; skipping the Droidspaces feature"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "> ⏭️ **Droidspaces (virtualization support)** automatically skipped: failed to clone the patch repository (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "DROIDSPACES_SKIPPED=true" >> "$GITHUB_ENV"
          else
            echo "::error::Failed to clone the Droidspaces patch repository"
            exit 1
          fi

      - name: Back up baseline defconfig
        run: cp "$DEFCONFIG" "$DEFCONFIG.orig"

      - name: Integrate Droidspaces support
        if: inputs.droidspaces != 'off' && env.DROIDSPACES_SKIPPED != 'true'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          KERNEL_VER="${{ inputs.kernel_version }}"
          SLOT="${{ inputs.droidspaces }}"

          # 678 -> 6_7_8, 123 -> 1_2_3, 345 -> 3_4_5
          SLOT_NAME=$(echo "$SLOT" | sed 's/\(.\)/\1_/g; s/_$//')
          echo "Applying Droidspaces SYSVIPC kABI fix patch (slot: $SLOT / $SLOT_NAME)..."
          case "$KERNEL_VER" in
            6.12)
              PATCH_FILE="$DROIDSPACES_PATCHES/kernel-6.12/001.GKI-6.12-or-above-fix_sysvipc_kabi.patch"
              ;;
            5.10|5.15|6.1|6.6)
              PATCH_FILE="$DROIDSPACES_PATCHES/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_${SLOT_NAME}.patch"
              ;;
            *)
              echo "::warning::Droidspaces: Unsupported kernel version $KERNEL_VER; skipping patch"
              exit 0
              ;;
          esac
          if [ ! -f "$PATCH_FILE" ]; then
            if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
              echo "::warning title=Droidspaces skipped::patch file not found $PATCH_FILE，skipped Droidspaces feature"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **Droidspaces (virtualization support)** automatically skipped: patch file $PATCH_FILE not found (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "DROIDSPACES_SKIPPED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::Droidspaces patch file not found: $PATCH_FILE"
            exit 1
          fi
          if ! patch -p1 --forward < "$PATCH_FILE"; then
            echo "::warning::SYSVIPC kABI patch application failed，may already be applied or context does not match"
          fi

          # 5.10 and below also require the POSIX_MQUEUE kABI fix
          if [ "$KERNEL_VER" = "5.10" ]; then
            echo "Applying Droidspaces POSIX_MQUEUE kABI fix patch (5.10)..."
            POSIX_PATCH="$DROIDSPACES_PATCHES/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
            if ! patch -p1 --forward < "$POSIX_PATCH"; then
              echo "::warning::POSIX_MQUEUE kABI patch application failed，may already be applied or context does not match"
            fi
          fi

          # Android 16 / 6.12 rust_binder.ko references the symbols after IPC_NS is enabled
          # init_ipc_ns and put_ipc_ns, but the current AOSP common branch has not exported these symbols.
          # Add these exports here to prevent modpost from failing due to undefined symbols.
          if [ "$KERNEL_VER" = "6.12" ]; then
            if [ -f "ipc/msgutil.c" ] && ! grep -qF 'EXPORT_SYMBOL(init_ipc_ns);' "ipc/msgutil.c"; then
              sed -i '/^struct msg_msgseg {/i EXPORT_SYMBOL(init_ipc_ns);' "ipc/msgutil.c"
              echo "Export added for init_ipc_ns"
            fi

            if [ -f "ipc/namespace.c" ] && ! grep -qF 'EXPORT_SYMBOL(put_ipc_ns);' "ipc/namespace.c"; then
              sed -i '/^static struct ns_common \*ipcns_get(/i EXPORT_SYMBOL(put_ipc_ns);' "ipc/namespace.c"
              echo "Export added for put_ipc_ns"
            fi
          fi

          echo "Adding Droidspaces kernel configuration..."
          # Handle each configuration per the documentation: skip if enabled, replace "# not set", and append if missing
          enable_config() {
            local cfg="$1"
            if grep -q "^${cfg}=y" "$DEFCONFIG"; then
              echo "  enabled: $cfg"
            elif grep -q "^# ${cfg} is not set" "$DEFCONFIG"; then
              sed -i "s/^# ${cfg} is not set$/${cfg}=y/" "$DEFCONFIG"
              echo "  Switched: $cfg"
            else
              echo "${cfg}=y" >> "$DEFCONFIG"
              echo "  Added: $cfg"
            fi
          }

          config_defined() {
            local name="${1#CONFIG_}"
            grep -RqsE --include='Kconfig*' "^[[:space:]]*(menuconfig|config)[[:space:]]+${name}$" .
          }

          enable_config_if_defined() {
            local cfg="$1"
            if config_defined "$cfg"; then
              enable_config "$cfg"
            else
              echo "  Not defined in the current kernel: $cfg; skipping"
            fi
          }

          # Required configuration
          enable_config CONFIG_SYSVIPC
          enable_config CONFIG_POSIX_MQUEUE
          enable_config CONFIG_IPC_NS
          enable_config CONFIG_PID_NS
          enable_config CONFIG_DEVTMPFS

          # Optional: networking configuration (Docker/NAT mode)
          enable_config_if_defined CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          enable_config_if_defined CONFIG_NETFILTER_XT_TARGET_LOG
          enable_config_if_defined CONFIG_NETFILTER_XT_MATCH_RECENT
          enable_config_if_defined CONFIG_IP_SET
          enable_config_if_defined CONFIG_IP_SET_HASH_IP
          enable_config_if_defined CONFIG_IP_SET_HASH_NET
          enable_config_if_defined CONFIG_NETFILTER_XT_SET

          # The REJECT target symbol may differ between kernel versions; enable the configuration that actually exists
          enable_config_if_defined CONFIG_NETFILTER_XT_TARGET_REJECT
          enable_config_if_defined CONFIG_IP_NF_TARGET_REJECT

          echo "Droidspaces integration complete"

          echo "GKI 6.6 configuration for regular-user networking (Droidspaces)"
          # Handle =n configuration types specifically (Android network permissions must be disabled)
          disable_config() {
            local cfg="$1"
            if grep -q "^${cfg}=n" "$DEFCONFIG"; then
              echo "  Disabled: $cfg"
            elif grep -q "^${cfg}=y" "$DEFCONFIG"; then
              sed -i "s/^${cfg}=y$/${cfg}=n/" "$DEFCONFIG"
              echo "  Off: $cfg"
            else
              echo "# ${cfg} is not set" >> "$DEFCONFIG"
              echo "  Added and disabled: $cfg"
            fi
          }

          if [[ "${{ inputs.android_version }}" == "android15" && "${{ inputs.kernel_version }}" == "6.6" ]]; then
            # 1. Enable user namespaces (required)
            # enable_config_if_defined CONFIG_USER_NS
            # 2. Disable strict Android network controls (required)
            disable_config CONFIG_ANDROID_PARANOID_NETWORK
          fi

      - name: Inject NTSync kernel configuration
        if: inputs.droidspaces != 'off' && inputs.droidspaces_ntsync && env.DROIDSPACES_SKIPPED != 'true'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -e
          echo "=== Injecting NTSync kernel patches ==="
          echo "Android version: ${{ inputs.android_version }}"
          echo "Kernel version: ${{ inputs.kernel_version }}"

          case "${{ inputs.android_version }}-${{ inputs.kernel_version }}" in
            android12-5.10)
              NTSYNC_PATCH="ntsync_compat_android12-5.10"
              ;;
            android13-5.15)
              NTSYNC_PATCH="ntsync_compat_android13-5.15"
              ;;
            android14-6.1)
              NTSYNC_PATCH="ntsync_compat_android14-6.1"
              ;;
            android15-6.6)
              NTSYNC_PATCH="ntsync_compat_android15-6.6"
              ;;
            android16-6.12)
              NTSYNC_PATCH="ntsync_compat_android16-6.12"
              ;;
            *)
              echo "::warning::NTSync: Not supported for ${{ inputs.android_version }} / ${{ inputs.kernel_version }}; skipping patch"
              exit 0
              ;;
          esac

          ntsync_fail() {
            if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
              echo "::warning title=NTSync skipped::$1，skipped NTSync feature"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **NTSync** automatically skipped：$1（build not interrupted）" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "NTSYNC_SKIPPED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::$1"
            exit 1
          }

          NTSYNC_PATCH_URL="https://raw.githubusercontent.com/Goldzxcbug/Droidspaces_Kernel_patch/refs/heads/main/NTsync"
          NTSYNC_COMPAT_HEADER="$GITHUB_WORKSPACE/scripts/ntsync_compat/ntsync_lockdep_compat.h"

          # Platform wiring: write Kconfig/Makefile entries idempotently.
          # The upstream platform patch combines "wiring" and the "lockdep backport" in one patch; any context drift causes the entire step to fail;
          # The wiring itself is only two lines; writing it separately avoids dependence on upstream patch context.
          ntsync_wire_misc() {
            if ! grep -q '^config NTSYNC$' drivers/misc/Kconfig; then
              awk '
                !done && /^endmenu$/ {
                  print "config NTSYNC"
                  print "\ttristate \"NT synchronization primitive emulation\""
                  print "\tdefault\tm"
                  print "\thelp"
                  print "\t  This module provides kernel support for emulation of Windows NT"
                  print "\t  synchronization primitives. It is not a hardware driver."
                  print ""
                  print "\t  To compile this driver as a module, choose M here: the"
                  print "\t  module will be called ntsync."
                  print ""
                  print "\t  If unsure, say N."
                  print ""
                  done = 1
                }
                { print }
              ' drivers/misc/Kconfig > drivers/misc/Kconfig.ntsync &&
                mv drivers/misc/Kconfig.ntsync drivers/misc/Kconfig
            else
              # If present but marked BROKEN (6.12 mainline), remove the dependency or the symbol remains unavailable.
              ntsync_strip_broken
            fi

            if ! grep -Fq 'obj-$(CONFIG_NTSYNC)' drivers/misc/Makefile; then
              printf 'obj-$(CONFIG_NTSYNC)\t\t+= ntsync.o\n' >> drivers/misc/Makefile
            fi

            ntsync_wired
          }

          # The lockdep compatibility layer: introduced in v5.13 lockdep_assert()/LOCK_STATE_*。
          # The include/linux/lockdep.h hunk in the upstream platform patch expects lockdep_assert_none_held_once() (v5.13+),
          # it will inevitably be rejected on 5.10 while kernel/locking/lockdep.c is still modified; a partially applied kernel cannot compile.
          # Only export the two symbols actually used by the driver; leave core kernel locking code untouched, preserving upstream semantics.
          ntsync_inject_lockdep_compat() {
            cp "$NTSYNC_COMPAT_HEADER" drivers/misc/ntsync_lockdep_compat.h
            if ! grep -q 'ntsync_lockdep_compat.h' drivers/misc/ntsync.c; then
              sed -i 's|^#define NTSYNC_NAME|#include "ntsync_lockdep_compat.h"\n\n#define NTSYNC_NAME|' drivers/misc/ntsync.c
            fi
            grep -q 'ntsync_lockdep_compat.h' drivers/misc/ntsync.c
          }

          ntsync_has_lockdep_api() {
            grep -q 'define lockdep_assert(' include/linux/lockdep.h &&
              grep -q 'LOCK_STATE_NOT_HELD' include/linux/lockdep.h
          }

          # 6.12 mainline includes NTSYNC source, but Kconfig marks it as depends on BROKEN,
          # so it cannot be considered integrated; otherwise Kconfig discards CONFIG_NTSYNC=y from defconfig.
          ntsync_kconfig_block() {
            awk '
              /^config NTSYNC$/ { inblk = 1; print; next }
              inblk && /^(config |menuconfig |endmenu|source |menu )/ { exit }
              inblk { print }
            ' drivers/misc/Kconfig
          }

          ntsync_kconfig_wired() {
            grep -q '^config NTSYNC$' drivers/misc/Kconfig &&
              ! ntsync_kconfig_block |
                grep -q '^[[:space:]]*depends on[[:space:]]*BROKEN[[:space:]]*$'
          }

          ntsync_strip_broken() {
            grep -q '^config NTSYNC$' drivers/misc/Kconfig || return 0
            awk '
              /^config NTSYNC$/ { inblk = 1; print; next }
              inblk && /^(config |menuconfig |endmenu|source |menu )/ { inblk = 0 }
              inblk && /^[[:space:]]*depends on[[:space:]]*BROKEN[[:space:]]*$/ { next }
              { print }
            ' drivers/misc/Kconfig > drivers/misc/Kconfig.ntsync &&
              mv drivers/misc/Kconfig.ntsync drivers/misc/Kconfig
          }

          ntsync_wired() {
            ntsync_kconfig_wired &&
              grep -Fq 'obj-$(CONFIG_NTSYNC)' drivers/misc/Makefile
          }

          if [[ -f drivers/misc/ntsync.c && -f include/uapi/linux/ntsync.h ]]; then
            echo "NTSync source already exists（included in mainline），skip base patch"
          elif [[ ! -e drivers/misc/ntsync.c && ! -e include/uapi/linux/ntsync.h ]]; then
            wget -q "${NTSYNC_PATCH_URL}/ntsync_base.patch" ||
              ntsync_fail "NTSync base patchdownloadfailed"
            patch --batch --forward -p1 < ntsync_base.patch ||
              ntsync_fail "NTSync base patch application failed (may be incompatible with the current kernel)"
          else
            ntsync_fail "NTSync source is incomplete (driver and uapi headers do not match)"
          fi

          # Platform patch: integration is complete only when source, Kconfig/Makefile wiring, and lockdep API are all present.
          if ntsync_wired && ntsync_has_lockdep_api; then
            echo "NTSync is integrated; skipping platform patch"
          else
            wget -q "${NTSYNC_PATCH_URL}/${NTSYNC_PATCH}.patch" ||
              ntsync_fail "NTSync platform patch ${NTSYNC_PATCH}.patch downloadfailed"

            # First do a dry run: if a patch is partially applied (lockdep.c changed but lockdep.h did not), the kernel cannot compile,
            # so write it only if it can be fully applied; otherwise use the local wiring/compatibility layer.
            if patch --batch --forward --dry-run -p1 < "${NTSYNC_PATCH}.patch" > /tmp/ntsync_platform.log 2>&1; then
              echo "Upstream platform patch can be applied completely; applying it (including lockdep backport)"
              patch --batch --forward -p1 < "${NTSYNC_PATCH}.patch" ||
                ntsync_fail "NTSync platform patch application failed (may be incompatible with the current kernel)"
            else
              echo "::notice title=NTSync compatibility layer::Upstream platform patch context does not match; using local wiring (equivalent functionality)"
              sed -n '1,30p' /tmp/ntsync_platform.log
              EXTRA_FILES=$(grep '^diff --git' "${NTSYNC_PATCH}.patch" |
                grep -v 'drivers/misc/Kconfig' | grep -v 'drivers/misc/Makefile' |
                grep -v 'include/linux/lockdep.h' | grep -v 'kernel/locking/lockdep.c' || true)
              if [ -n "$EXTRA_FILES" ]; then
                echo "::warning title=NTSync compatibility layer::Platform patch also contains unsupported changes; skipping: $EXTRA_FILES"
              fi
              ntsync_wire_misc || ntsync_fail "Failed to write NTSync platform wiring"
              if ntsync_has_lockdep_api; then
                echo "kernelprovides lockdep_assert()/LOCK_STATE_*; no lockdep compatibility layer is needed"
              else
                ntsync_inject_lockdep_compat || ntsync_fail "Failed to inject NTSync lockdep compatibility layer"
                if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "> 🔧 **NTSync**：Upstream platform patch context does not match this kernel; enabled the local lockdep compatibility layer (equivalent functionality; build continues)" >> "$GITHUB_STEP_SUMMARY"
                fi
              fi
            fi
          fi

          # Fallback: some platform patches only change Kconfig (e.g. 6.12 only removes BROKEN); ensure Makefile wiring here.
          ntsync_wired || ntsync_wire_misc || ntsync_fail "NTSync platform wiring is incomplete（Kconfig/Makefile）"

          cd ..

          # Configuration path
          CONFIG_PATH="./common/arch/arm64/configs/gki_defconfig"
          echo "Checking and enabling CONFIG_NTSYNC..."

          # Remove the disabled marker, then append the enabled entry to keep repeated runs idempotent.
          sed -i '/CONFIG_NTSYNC is not set/d' "$CONFIG_PATH"
          if ! grep -q "^CONFIG_NTSYNC=y" "$CONFIG_PATH"; then
            echo "CONFIG_NTSYNC=y" >> "$CONFIG_PATH"
            echo "✅ CONFIG_NTSYNC successfully enabled"
          else
            echo "✅ CONFIG_NTSYNC is already enabled"
          fi

          echo "=== NTSync patches and configuration injection complete ==="

      - name: Apply Unicode bypass fix
        if: inputs.enable_susfs
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          if [ "${{ inputs.kernel_version }}" = "5.10" ] || [ "${{ inputs.kernel_version }}" = "5.15" ]; then
            patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1-.patch" || true
          else
            patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1+.patch" || true
          fi

          # If the SUSFS main patch or upstream ASB already includes the same fs/unicode change, the bypass patch hunk
          # is detected as previously applied: the source is correct (and compiles), but the hunk
          # is still written to .rej and pollutes the Rejects artifact. Remove this expected conflict here;
          # mkutf8data.c still contains ignore_init, indicating a genuine omission; keep the .rej for troubleshooting.
          if [ -f fs/unicode/mkutf8data.c.rej ] && [ -f fs/unicode/mkutf8data.c ] \
            && ! grep -q 'ignore_init' fs/unicode/mkutf8data.c; then
            echo "fs/unicode .rej is an expected conflict from the same change already being applied; remove it (build unaffected)"
            rm -f fs/unicode/*.rej
          fi

      - name: Configure ZRAM LZ4 patch stack
        if: inputs.use_zram
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # Preflight: all patch resources must exist; if missing, follow the compatibility-skip policy to avoid a partial modification followed by failure
          # Patch source by version: prefer this repository's zram_patch/<ver>/, with SukiSU_patch as fallback;
          # Versions not yet covered upstream (such as 6.12) are supplied by this repository
          pick_zram_patch() {
            local name="$1"
            if [ -f "$ZZH_PATCHES/zram_patch/${{ inputs.kernel_version }}/$name" ]; then
              echo "$ZZH_PATCHES/zram_patch/${{ inputs.kernel_version }}/$name"
            elif [ -f "$SUKISU_PATCHES/other/zram/zram_patch/${{ inputs.kernel_version }}/$name" ]; then
              echo "$SUKISU_PATCHES/other/zram/zram_patch/${{ inputs.kernel_version }}/$name"
            else
              echo ""
            fi
          }
          LZ4KD_PATCH=$(pick_zram_patch lz4kd.patch)
          LZ4K_OPLUS_PATCH=$(pick_zram_patch lz4k_oplus.patch)

          MISSING=""
          [ -d "$ZZH_PATCHES/zram/lz4" ] || MISSING="$MISSING zram/lz4"
          [ -f "$ZZH_PATCHES/zram/apply_lz4_neon.sh" ] || MISSING="$MISSING zram/apply_lz4_neon.sh"
          [ -d "$ZZH_PATCHES/zram/include/linux" ] || MISSING="$MISSING zram/include/linux"
          [ -d "$SUKISU_PATCHES/other/zram/lz4k" ] || MISSING="$MISSING SukiSU_patch/other/zram/lz4k"
          [ -d "$SUKISU_PATCHES/other/zram/lz4k_oplus" ] || MISSING="$MISSING SukiSU_patch/other/zram/lz4k_oplus"
          [ -n "$LZ4KD_PATCH" ] || MISSING="$MISSING zram_patch/${{ inputs.kernel_version }}/lz4kd.patch"
          [ -n "$LZ4K_OPLUS_PATCH" ] || MISSING="$MISSING zram_patch/${{ inputs.kernel_version }}/lz4k_oplus.patch"
          if [ -n "$MISSING" ]; then
            if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
              echo "::warning title=ZRAM skipped::Missing ZRAM patch resources: $MISSING; skipping the ZRAM feature"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **ZRAM / LZ4KD** automatically skipped：Missing ZRAM patch resources: $MISSING（build not interrupted）" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "ZRAM_SKIPPED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::Missing ZRAM patch resources: $MISSING"
            exit 1
          fi

          zram_step_fail() {
            if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
              echo "::warning title=ZRAM skipped::$1，skipped ZRAM feature"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **ZRAM / LZ4KD** automatically skipped：$1（build not interrupted）" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "ZRAM_SKIPPED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::$1"
            exit 1
          }

          echo "Upgrade LZ4..."
          rm -f lib/lz4/lz4_compress.c lib/lz4/lz4_decompress.c lib/lz4/lz4defs.h lib/lz4/lz4hc_compress.c

          cp -r $ZZH_PATCHES/zram/lz4/* ./lib/lz4/
          cp -r $ZZH_PATCHES/zram/include/linux/* ./include/linux/
          if ! bash $ZZH_PATCHES/zram/apply_lz4_neon.sh; then
            zram_step_fail "apply_lz4_neon.sh execution failed"
          fi

          if [ -f "fs/f2fs/Makefile" ] && ! grep -qF "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" "fs/f2fs/Makefile"; then
            echo "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" >> "fs/f2fs/Makefile"
          fi

          cp -r $SUKISU_PATCHES/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/lib/* ./lib/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/crypto/* ./crypto/
          cp -r $SUKISU_PATCHES/other/zram/lz4k_oplus ./lib/

          cp "$LZ4KD_PATCH" ./lz4kd.patch
          if ! patch -p1 -F 3 < lz4kd.patch; then
            echo "::warning::lz4kd.patch application failed，may already be applied or context does not match"
          fi

          cp "$LZ4K_OPLUS_PATCH" ./lz4k_oplus.patch
          if ! patch -p1 -F 3 < lz4k_oplus.patch; then
            echo "::warning::lz4k_oplus.patch application failed，may already be applied or context does not match"
          fi

      - name: Fix 6.6 WiFi/Bluetooth compatibility (Samsung + Xiaomi)
        if: inputs.kernel_version == '6.6'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          ensure_line_once() {
            local file="$1"
            local line="$2"
            if [ ! -f "$file" ]; then
              echo "::error::File does not exist: $file"
              exit 1
            fi
            if ! grep -qF "$line" "$file"; then
              echo "$line" >> "$file"
            fi
          }

          GALAXY_SYMBOL_LIST="android/abi_gki_aarch64_galaxy"
          XIAOMI_SYMBOL_LIST="android/abi_gki_aarch64_xiaomi"
          DRIVERS_MAKEFILE="drivers/Makefile"
          MIN_KDP_SRC="$KERNEL_PATCHES/samsung/min_kdp/min_kdp.c"
          MIN_KDP_PATCH="$KERNEL_PATCHES/samsung/min_kdp/add-min_kdp-symbols.patch"
          MIN_KDP_DST="drivers/min_kdp.c"

          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_set_cred_non_rcu"
          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_usecount_dec_and_test"
          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_usecount_inc"

          if [ ! -f "$MIN_KDP_PATCH" ]; then
            echo "::error::Patch does not exist: $MIN_KDP_PATCH"
            exit 1
          fi
          if patch -p1 --dry-run < "$MIN_KDP_PATCH" >/dev/null 2>&1; then
            patch -p1 --no-backup-if-mismatch < "$MIN_KDP_PATCH"
          else
            echo "min_kdp symbols patch is already applied or the current context does not match; skipping."
          fi

          if [ ! -f "$MIN_KDP_SRC" ]; then
            echo "::error::File does not exist: $MIN_KDP_SRC"
            exit 1
          fi
          cp "$MIN_KDP_SRC" "$MIN_KDP_DST"
          ensure_line_once "$DRIVERS_MAKEFILE" "obj-y += min_kdp.o"

          ensure_line_once "$XIAOMI_SYMBOL_LIST" "device_find_any_child"

      - name: Configure ZRAM options
        if: inputs.use_zram && env.ZRAM_SKIPPED != 'true'
        run: |
          CONFIG_FILE="$DEFCONFIG"

          if [ "${{ inputs.kernel_version }}" = "5.10" ]; then
            cat >> "$CONFIG_FILE" <<'EOF'
          CONFIG_ZSMALLOC=y
          CONFIG_ZRAM=y
          CONFIG_MODULE_SIG=n
          CONFIG_CRYPTO_LZO=y
          CONFIG_ZRAM_DEF_COMP_LZ4KD=y
          EOF
          fi

          if [ "${{ inputs.kernel_version }}" != "6.6" ] && [ "${{ inputs.kernel_version }}" != "5.10" ]; then
            if grep -q "CONFIG_ZSMALLOC" "$CONFIG_FILE"; then
              sed -i 's/CONFIG_ZSMALLOC=m/CONFIG_ZSMALLOC=y/g' "$CONFIG_FILE"
            else
              echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
            fi
            sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
          fi

          if [ "${{ inputs.kernel_version }}" = "6.6" ]; then
            echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
            sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
          fi

          if [ "${{ inputs.android_version }}" = "android14" ] || [ "${{ inputs.android_version }}" = "android15" ] || [ "${{ inputs.android_version }}" = "android16" ]; then
            sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "$KERNEL_ROOT/common/modules.bzl"
          fi

          if grep -q "CONFIG_ZSMALLOC=y" "$CONFIG_FILE" && grep -q "CONFIG_ZRAM=y" "$CONFIG_FILE"; then
            # ZRAM_BACKEND_* is declared in Kconfig only for 6.12+; bazel builds validate kernel_config
            # and require every configuration item in the fragment to exist in Kconfig; older kernels would fail
            # compilation if these lines are included, so remove them below 6.12
            if [ "$(printf '%s\n' "6.12" "${{ inputs.kernel_version }}" | sort -V | head -1)" = "6.12" ]; then
              cat "$ZZH_PATCHES/config/zram.config" >> "$CONFIG_FILE"
            else
              grep -v '^CONFIG_ZRAM_BACKEND_' "$ZZH_PATCHES/config/zram.config" >> "$CONFIG_FILE"
            fi
          fi

      - name: Add BBG baseband protection patch
        if: inputs.use_bbg
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          bbg_fail() {
            # Roll back the incomplete installation to prevent leftover references from breaking compilation
            sh /tmp/bbg_setup.sh --cleanup >/dev/null 2>&1 || true
            if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
              echo "::warning title=BBG skipped::$1，skipped BBG baseband protectionfeature"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **BBG baseband protection** automatically skipped：$1（build not interrupted）" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "BBG_SKIPPED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::$1"
            exit 1
          }

          if ! wget -qO /tmp/bbg_setup.sh https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh; then
            bbg_fail "Failed to download the BBG install script"
          fi
          if ! sh /tmp/bbg_setup.sh; then
            bbg_fail "Failed to execute the BBG install script"
          fi
          if [ ! -f common/security/baseband-guard/Kconfig ] || ! grep -q 'baseband-guard' common/security/Makefile; then
            bbg_fail "BBG installation validation failed (may be incompatible with the current kernel directory structure)"
          fi

          echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig

      - name: Apply network enhancements (BBRv3 / IPSet / Qdisc / CIFS)
        if: inputs.use_net_enhance
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -euo pipefail

          net_fail() {
            if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
              echo "::warning title=network enhancements skipped::$1，skipped network enhancementsfeature"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **network enhancements (BBRv3 / IPSet / Qdisc / CIFS)** automatically skipped：$1（build not interrupted）" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "NET_ENHANCE_SKIPPED=true" >> "${GITHUB_ENV:-/dev/null}"
              exit 0
            fi
            echo "::error::$1"
            exit 1
          }

          echo "=== Apply network enhancements (BBRv3 / IPSet / Qdisc / CIFS)==="
          BBR3_DIR="$KERNEL_PATCHES/common/bbrv3"
          KVER="${{ inputs.kernel_version }}"
          AVER="${{ inputs.android_version }}"

          # ---------- BBRv3 patches: dispatch by version (from WildKernels/kernel_patches) ----------
          case "$AVER-$KVER" in
            android12-5.10) BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch" ;;
            android13-5.15) BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android13-5.15.patch" ;;
            android14-6.1)  BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android14-6.1.patch" ;;
            android15-6.6)  BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android15-6.6.patch" ;;
            *) BBR3_PATCH="" ;;
          esac

          # android16-6.12 has no backport patch; retain baseline BBR v1 only
          if [ -n "$BBR3_PATCH" ]; then
            [ -f "$BBR3_PATCH" ] || net_fail "BBRv3 Patch does not exist：${BBR3_PATCH#"$KERNEL_PATCHES"/}"
            if patch -p1 --dry-run --forward < "$BBR3_PATCH" >/dev/null 2>&1; then
              patch -p1 --no-backup-if-mismatch < "$BBR3_PATCH"
              echo "[+] BBRv3 patch applied"
            elif patch -p1 --dry-run --forward -F 3 < "$BBR3_PATCH" >/dev/null 2>&1; then
              # LTS branches continuously merge upstream stable commits (for example, in sysctl_net_ipv4.c,
              # tcp_min_rcvbuf); patch context lines drift accordingly. fuzz 3 loosens context only
              # matching; hunk content must remain exact, safely accommodating this drift.
              patch -p1 --no-backup-if-mismatch -F 3 < "$BBR3_PATCH"
              echo "[+] BBRv3 patch applied (LTS context drift, fuzz 3)"
            elif grep -q '^config TCP_CONG_BBR3' net/ipv4/Kconfig; then
              echo "[*] BBRv3 patch was already applied; skipping"
            else
              net_fail "BBRv3 patch application failed（${AVER}-${KVER}）"
            fi
            # Prevent compilation from continuing if fuzz application misses added files/configuration entries
            [ -f net/ipv4/tcp_bbr3.c ] || net_fail "BBRv3 missing after patch application net/ipv4/tcp_bbr3.c"
            grep -q '^config TCP_CONG_BBR3' net/ipv4/Kconfig || net_fail "TCP_CONG_BBR3 configuration entry missing after applying the BBRv3 patch"
          else
            echo "[*] ${AVER}-${KVER} no BBRv3 backport; using BBR v1"
          fi

          # Older kernels such as 5.15.41 lack tcp_snd_cwnd accessors (backported to newer 5.15),
          # the BBRv3 patch depends on them; add them only when missing.
          if [ -n "$BBR3_PATCH" ] && ! grep -q 'tcp_snd_cwnd' include/net/tcp.h; then
            python3 "$GITHUB_WORKSPACE/scripts/net_compat/add_tcp_snd_cwnd.py" \
              || net_fail "Failed to handle tcp_snd_cwnd compatibility for older kernels"
          fi

          # 5.10 lacks proc_dou8vec_minmax (a 5.15+ sysctl API required by BBRv3); apply two prerequisite patches
          if [ "$KVER" = "5.10" ] && ! grep -qF 'int proc_dou8vec_minmax(' include/linux/sysctl.h 2>/dev/null; then
            for prepatch in sysctl_add_proc_dou8vec_minmax sysctl_fix_data-races_in_proc_dou8vec_minmax; do
              if patch -p1 --dry-run < "$BBR3_DIR/$prepatch.patch" >/dev/null 2>&1; then
                patch -p1 --no-backup-if-mismatch < "$BBR3_DIR/$prepatch.patch"
              else
                net_fail "Failed to apply 5.10 sysctl prerequisite patch：$prepatch"
              fi
            done
            echo "[+] 5.10 sysctl prerequisite patch applied"
          fi

          set_config() {
            local key="$1" value="$2"
            if grep -q "^$key=" "$DEFCONFIG"; then
              sed -i "s|^$key=.*|$key=$value|g" "$DEFCONFIG"
            elif grep -q "^# $key is not set" "$DEFCONFIG"; then
              sed -i "s|^# $key is not set|$key=$value|g" "$DEFCONFIG"
            else
              echo "$key=$value" >> "$DEFCONFIG"
            fi
          }

          # Full IPSet suite + netfilter integration (verified in Kconfig for all versions)
          for cfg in IP_SET IP_SET_BITMAP_IP IP_SET_BITMAP_IPMAC IP_SET_BITMAP_PORT \
            IP_SET_HASH_IP IP_SET_HASH_IPMARK IP_SET_HASH_IPPORT IP_SET_HASH_IPPORTIP \
            IP_SET_HASH_IPPORTNET IP_SET_HASH_IPMAC IP_SET_HASH_MAC \
            IP_SET_HASH_NETPORTNET IP_SET_HASH_NET IP_SET_HASH_NETNET \
            IP_SET_HASH_NETPORT IP_SET_HASH_NETIFACE IP_SET_LIST_SET \
            NETFILTER_XT_MATCH_ADDRTYPE NETFILTER_XT_SET NETFILTER_XT_TARGET_LOG \
            NETFILTER_XT_MATCH_RECENT IP6_NF_NAT IP6_NF_TARGET_MASQUERADE; do
            set_config "CONFIG_$cfg" y
          done
          set_config CONFIG_IP_SET_MAX 65534

          # TCP congestion control: default to bbr3 for versions patched with BBRv3; otherwise default to bbr
          for cfg in TCP_CONG_ADVANCED TCP_CONG_BBR TCP_CONG_CUBIC \
            TCP_CONG_BIC TCP_CONG_WESTWOOD TCP_CONG_HTCP; do
            set_config "CONFIG_$cfg" y
          done
          if [ -n "$BBR3_PATCH" ]; then
            set_config CONFIG_TCP_CONG_BBR3 y
            set_config CONFIG_DEFAULT_BBR3 y
            set_config CONFIG_DEFAULT_TCP_CONG '"bbr3"'
          else
            set_config CONFIG_DEFAULT_BBR y
            set_config CONFIG_DEFAULT_TCP_CONG '"bbr"'
          fi

          # Traffic shaping Qdisc + connection marking + TTL/HopLimit + WireGuard
          for cfg in NET_SCH_FQ NET_SCH_FQ_CODEL NET_SCH_CAKE NET_ACT_CONNMARK \
            IP_NF_TARGET_TTL IP6_NF_TARGET_HL IP6_NF_MATCH_HL WIREGUARD; do
            set_config "CONFIG_$cfg" y
          done

          # CIFS network filesystem (NETFS_SUPPORT is a hidden symbol selected by Kconfig as needed)
          for cfg in CIFS NETWORK_FILESYSTEMS KEYS CIFS_XATTR CIFS_POSIX; do
            set_config "CONFIG_$cfg" y
          done

          # After NETFS is built into 6.12, remove its module entry from modules.bzl or packaging fails
          if [ "$AVER" = "android16" ] && grep -q '"fs/netfs/netfs.ko",' modules.bzl 2>/dev/null; then
            sed -i '/"fs\/netfs\/netfs\.ko",/d' modules.bzl
          fi

          # Post-write validation: required symbols must be written to disk
          grep -q '^CONFIG_IP_SET=y$' "$DEFCONFIG" || net_fail "IPSet configuration write validation failed"
          grep -q '^CONFIG_IP_SET_MAX=65534$' "$DEFCONFIG" || net_fail "IPSet maximum set count configuration write validation failed"
          grep -q '^CONFIG_NET_SCH_FQ=y$' "$DEFCONFIG" || net_fail "FQ qdisc configuration write validation failed"
          grep -q '^CONFIG_CIFS=y$' "$DEFCONFIG" || net_fail "CIFS configuration write validation failed"
          if [ -n "$BBR3_PATCH" ]; then
            grep -q '^CONFIG_DEFAULT_TCP_CONG="bbr3"$' "$DEFCONFIG" || net_fail "BBRv3 default congestion control configuration write validation failed"
          else
            grep -q '^CONFIG_DEFAULT_TCP_CONG="bbr"$' "$DEFCONFIG" || net_fail "BBR default congestion control configuration write validation failed"
          fi
          echo "[+] network enhancementsconfiguration complete"

      - name: Apply Re-Kernel
        if: inputs.use_rekernel
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          if ( set -e
            echo "Integrating Re-Kernel..."
            TMP_REKERNEL=/tmp/rekernel
            rm -rf "$TMP_REKERNEL"
            git clone --depth 1 https://github.com/Sakion-Team/Re-Kernel.git "$TMP_REKERNEL"

            # Sync the complete driver source split out upstream
            rm -rf common/drivers/rekernel
            mkdir -p common/drivers/rekernel
            cp -a "$TMP_REKERNEL/LKM-Source/." common/drivers/rekernel/

            # Adapt the upstream external-module configuration for the in-kernel driver
            REKERNEL_MAKEFILE="common/drivers/rekernel/Makefile"
            sed -i 's/^obj-m := rekernel\.o$/obj-$(CONFIG_REKERNEL) += rekernel.o/' "$REKERNEL_MAKEFILE"
            grep -qF 'ccflags-$(CONFIG_REKERNEL_LEGACY_NETLINK) += -DLEGACY_NETLINK' "$REKERNEL_MAKEFILE" || \
              echo 'ccflags-$(CONFIG_REKERNEL_LEGACY_NETLINK) += -DLEGACY_NETLINK' >> "$REKERNEL_MAKEFILE"
            sed -i '/^[[:space:]]*depends on MODULES[[:space:]]*$/d' common/drivers/rekernel/Kconfig

            # Link into the driver tree
            if ! grep -qF 'source "drivers/rekernel/Kconfig"' common/drivers/Kconfig; then
              sed -i '/^endmenu$/i source "drivers/rekernel/Kconfig"' common/drivers/Kconfig
            fi
            if ! grep -qF 'obj-$(CONFIG_REKERNEL) += rekernel/' common/drivers/Makefile; then
              echo 'obj-$(CONFIG_REKERNEL) += rekernel/' >> common/drivers/Makefile
            fi

            # Fix the header include path (for in-tree compilation)
            sed -i 's|#include <../android/binder_internal.h>|#include "../android/binder_internal.h"|g' common/drivers/rekernel/rekernel_binder.c
            # Add the definitions required for 5.10 binder_internal.h to use DEFINE_SHOW_ATTRIBUTE
            grep -qF '#include <linux/seq_file.h>' common/drivers/rekernel/rekernel_binder.c || \
              sed -i '/#include <linux\/kprobes.h>/a #include <linux/seq_file.h>' common/drivers/rekernel/rekernel_binder.c

            # Configure defconfig (idempotently)
            grep -q '^CONFIG_REKERNEL=y$' "$DEFCONFIG" || echo "CONFIG_REKERNEL=y" >> "$DEFCONFIG"
            grep -q '^CONFIG_REKERNEL_NETWORK=y$' "$DEFCONFIG" || echo "CONFIG_REKERNEL_NETWORK=y" >> "$DEFCONFIG"
          ); then
            exit 0
          fi

          # Integration failed: roll back the incomplete state to prevent leftover references from breaking compilation
          rm -rf common/drivers/rekernel
          sed -i '\|source "drivers/rekernel/Kconfig"|d' common/drivers/Kconfig 2>/dev/null || true
          sed -i '\|obj-$(CONFIG_REKERNEL) += rekernel/|d' common/drivers/Makefile 2>/dev/null || true
          sed -i '/^CONFIG_REKERNEL=y$/d; /^CONFIG_REKERNEL_NETWORK=y$/d' "$DEFCONFIG" 2>/dev/null || true

          if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
            echo "::warning title=Re-Kernel skipped::Re-Kernel integration failed (repository unavailable or source incompatible with the current kernel); rolled back and skipped the feature"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "> ⏭️ **Re-Kernel** automatically skipped：integration failed（repository unavailable or source incompatible with the current kernel），rolled back（build not interrupted）" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "REKERNEL_SKIPPED=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::error::Re-Kernel integration failed"
          exit 1

      - name: Configure kernel options
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

          # After BakaSU was renamed upstream, Kconfig default values dropped @%REPO_NAME%; add the template explicitly,
          # alongside the REPO_NAME := LingLuo rewrite in ksu_post_setup.sh so the manager displays the @LingLuo suffix
          if [ "${{ inputs.ksu_variant }}" == "BakaSU" ]; then
            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@%REPO_NAME%"' >> "$DEFCONFIG"
          fi

          if [ "${{ inputs.ksu_variant }}" == "SukiSU" ] || [ "${{ inputs.ksu_variant }}" == "BakaSU" ]; then
            if [[ "${{ inputs.use_kpm }}" == enabled* ]] || [[ "${{ inputs.use_kpm }}" == patched* ]]; then
              if grep -RqsE '^[[:space:]]*config[[:space:]]+KPM([[:space:]]|$)' common KernelSU 2>/dev/null; then
                echo "CONFIG_KPM=y" >> "$DEFCONFIG"
              elif [ "$SKIP_INCOMPATIBLE" = "true" ]; then
                echo "::warning title=KPM skipped::Current KernelSU code does not declare CONFIG_KPM; skipped the KPM feature"
                if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "> ⏭️ **KPM** automatically skipped：current KernelSU codedoes not declare CONFIG_KPM（build not interrupted）" >> "$GITHUB_STEP_SUMMARY"
                fi
                echo "KPM_SKIPPED=true" >> "$GITHUB_ENV"
              else
                echo "Error:  KPM was requested, but the current KernelSU code does not declare CONFIG_KPM" >&2
                exit 1
              fi
            fi
          elif [ "${{ inputs.ksu_variant }}" == "FinaSU" ]; then
            if [[ "${{ inputs.use_kpm }}" == enabled* ]] || [[ "${{ inputs.use_kpm }}" == patched* ]]; then
              echo "::warning title=KPM not applicable::FinaSU does not support KPM; ignoring this option and continuing the build"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **KPM** ignored: FinaSU variant does not support KPM (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "KPM_SKIPPED=true" >> "$GITHUB_ENV"
            fi
          fi

          CURRENT_SUB="${{ inputs.sub_level }}"
          if [[ ! "$CURRENT_SUB" =~ ^[0-9]+$ ]]; then
            CURRENT_SUB=99999
          fi
          if [[ "${{ inputs.ksu_variant }}" == "BakaSU" && "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" && "$CURRENT_SUB" -ge 74 && "$CURRENT_SUB" -le 137 ]]; then
            echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG"
            # Fix 5.15.74~5.15.137: kallsyms_on_each_symbol is compiled only with LIVEPATCH, causing BakaSU linking to fail
            KALLSYMS_C="./common/kernel/kallsyms.c"
            if [ -f "$KALLSYMS_C" ] \
              && grep -qF 'int kallsyms_on_each_symbol' "$KALLSYMS_C" \
              && grep -qF '#endif /* CONFIG_LIVEPATCH */' "$KALLSYMS_C"; then
              sed -i '/^#ifdef CONFIG_LIVEPATCH$/,/^int kallsyms_on_each_symbol/ { /^#ifdef CONFIG_LIVEPATCH$/d }' "$KALLSYMS_C"
              sed -i '/^int kallsyms_on_each_symbol/,/^#endif \/\* CONFIG_LIVEPATCH \*\// { /^#endif \/\* CONFIG_LIVEPATCH \*\//d }' "$KALLSYMS_C"
              echo "Fixed the LIVEPATCH build restriction for kallsyms_on_each_symbol"
            fi
          fi

          sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: Add SUSFS configuration
        if: inputs.enable_susfs
        run: |
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

      - name: Configure kernel name
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          if [ -f "build/build.sh" ]; then
            sed -i 's/-dirty//' ./common/scripts/setlocalversion
          else
            sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' ./common/BUILD.bazel
            sed -i '/kmi_symbol_list_strict_mode/d' ./common/BUILD.bazel
            rm -rf ./common/android/abi_gki_protected_exports_*
            sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl
          fi

          VERSION_INPUT=$(echo "${{ inputs.version }}" | tr -d '[:space:]')
          if [ -n "$VERSION_INPUT" ]; then
            CLEAN_VERSION=$(echo "$VERSION_INPUT" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+//')
            perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}'"${CLEAN_VERSION}"'"/s' ./common/scripts/setlocalversion 2>/dev/null || true
            sed -i "\$s|echo \"\$res\"|echo \"${CLEAN_VERSION}\"|" ./common/scripts/setlocalversion 2>/dev/null || true
            sed -i '/^CONFIG_LOCALVERSION=/ s/="\([^"]*\)"/="'"$CLEAN_VERSION"'"/' ./common/arch/arm64/configs/gki_defconfig
          elif [ ! -f "build/build.sh" ]; then
            cd ./common
            BID="ab$((RANDOM % 90000000 + 10000000))"
            GHASH=$(git rev-parse --verify HEAD | cut -c1-13)
            case "${{ inputs.android_version }}-${{ inputs.kernel_version }}" in
              "android14-6.1")  KMI_TAG="android14-11" ;;
              "android15-6.6")  KMI_TAG="android15-8" ;;
              "android16-6.12") KMI_TAG="android16-5" ;;
              *) KMI_TAG="${{ inputs.android_version }}" ;;
            esac

            if [ "${{ inputs.kernel_version }}" = "6.1" ]; then
              KMI_LOCAL="-${KMI_TAG}-g${GHASH}-${BID}-4k"
              sed -i "\$s|echo \"\$res\"|echo \"${KMI_LOCAL}\"|" ./scripts/setlocalversion 2>/dev/null || true
              sed -i "/^CONFIG_LOCALVERSION=/ s/=\"[^\"]*\"/=\"${KMI_LOCAL}\"/" ./arch/arm64/configs/gki_defconfig 2>/dev/null || true
            else
              SUFFIX="-${KMI_TAG}-g${GHASH}-${BID}"
              perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}'"${SUFFIX}"'\$\{config_localversion\}"/s' ./scripts/setlocalversion 2>/dev/null || true
            fi
          fi

      - name: setCustom build time
        shell: bash
        env:
          INPUT_TIME: ${{ inputs.build_time }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "N" && "$INPUT_TIME" != "n" ]]; then
            # Trim leading/trailing whitespace and collapse consecutive spaces into single spaces (supports Dec 03 / Dec 3 / Dec  3 formats)
            INPUT_TIME="$(printf '%s' "$INPUT_TIME" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/[[:space:]][[:space:]]*/ /g')"

            TIME_REGEX='^(Mon|Tue|Wed|Thu|Fri|Sat|Sun) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) ( ?[1-9]|0[1-9]|[12][0-9]|3[01]) ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9] UTC [0-9]{4}$'
            if [[ ! "$INPUT_TIME" =~ $TIME_REGEX ]]; then
              echo "::error title=Build time format error::Custom build time must be in the form Tue Dec  1 08:10:00 UTC 2026; remove any extra prefix and use a two-digit day."
              exit 1
            fi

            # Parse as standard UTC time (rejecting invalid dates such as February 30)
            NORMALIZED_TIME="$(LC_ALL=C TZ=UTC date -u -d "$INPUT_TIME" +'%a %b %e %T UTC %Y' 2>/dev/null || true)"
            if [[ -z "$NORMALIZED_TIME" ]]; then
              echo "::error title=Invalid build time::Custom build time could not be parsed as a valid UTC time."
              exit 1
            fi

            # GNU date ignores the weekday field in the input, so remove the weekday, parse the date, then compare the actual weekday
            TYPED_WD="${INPUT_TIME%% *}"
            REAL_WD="$(LC_ALL=C TZ=UTC date -u -d "${INPUT_TIME#* }" +%a 2>/dev/null || true)"
            if [[ -z "$REAL_WD" || "$TYPED_WD" != "$REAL_WD" ]]; then
              echo "::error title=Weekday/date mismatch::The input weekday does not match the date; the actual weekday is ${REAL_WD:-unknown} (reference: $NORMALIZED_TIME)."
              exit 1
            fi

            DATESTR="$NORMALIZED_TIME"
          else
            DATESTR="$(TZ='CST-8' date +'%a %b %d %T UTC %Y')"
          fi

          echo "Using build time: $DATESTR"
          echo "KBUILD_BUILD_TIMESTAMP=$DATESTR" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

          # Handle mkcompile_h patches consistently
          f="$KERNEL_ROOT/common/scripts/mkcompile_h"
          if [ -f "$f" ]; then
            if [[ "${{ inputs.kernel_version }}" == "5.10" || "${{ inputs.kernel_version }}" == "5.15" ]]; then
              echo "Applying 5.x classic timestamp patch: $f"
              perl -pi -e "s{UTS_VERSION=\"\\\$\(echo \\\$UTS_VERSION \\\$CONFIG_FLAGS \\\$TIMESTAMP \\| cut -b -\\\$UTS_LEN\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
            else
              echo "Applying 6.x mkcompile_h patch: $f"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\\(.*?\\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          fi
          
      - name: Build kernel
        id: compile_kernel
        uses: nick-fields/retry@v4
        with:
          shell: bash
          timeout_minutes: 30
          max_attempts: 3
          retry_on: timeout
          command: |
            LOG_DIR="$GITHUB_WORKSPACE/build-logs"
            ATTEMPT_FILE="$LOG_DIR/.compile-attempt"
            mkdir -p "$LOG_DIR"

            # Create a separate log for each retry attempt
            ATTEMPT=1
            if [ -s "$ATTEMPT_FILE" ]; then
              read -r LAST_ATTEMPT < "$ATTEMPT_FILE"
              if [[ "$LAST_ATTEMPT" =~ ^[0-9]+$ ]]; then
                ATTEMPT=$((LAST_ATTEMPT + 1))
              fi
            fi
            echo "$ATTEMPT" > "$ATTEMPT_FILE"
            LOG_FILE="$LOG_DIR/compile-attempt-${ATTEMPT}.log"

            set -o pipefail
            {
              echo "Build attempt: $ATTEMPT"
              echo "Start time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "Current latest KSU commit date: ${KSU_LATEST_COMMIT_DATE}"
              echo "Current latest SUSFS commit date: ${SUSFS_LATEST_COMMIT_DATE}"
              set -ex
              cd "$KERNEL_ROOT"

              sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' ./common/build.config.gki.aarch64
              sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' ./common/build.config.gki.aarch64
              sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' ./common/build.config.gki.aarch64

              if [ -f "build/build.sh" ]; then
                LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh CC="/usr/bin/ccache clang" || exit 1
                strings "out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist/Image" | grep 'Linux version'
              else
                # Extract gki_defconfig changes into a fragment to avoid bazel trim check failures
                FRAG="common/arch/arm64/configs/ksu.fragment"
                diff "$DEFCONFIG.orig" "$DEFCONFIG" | grep '^>' | sed 's/^> //; s/^[[:space:]]*//' > "$FRAG" || true
                cp "$DEFCONFIG.orig" "$DEFCONFIG"
                echo "=== KSU fragment contents ==="
                cat "$FRAG"
                echo "========================="
                FRAG_FLAG=""
                if [ -s "$FRAG" ]; then
                  FRAG_FLAG="--defconfig_fragment=//common:arch/arm64/configs/ksu.fragment"
                fi
                LTO_FLAG="--lto=thin"
                if [ "${{ inputs.kernel_version }}" = "6.12" ]; then
                  LTO_FLAG="--lto=none"
                fi
                tools/bazel build --disk_cache=/home/runner/.cache/bazel --config=fast $LTO_FLAG $FRAG_FLAG //common:kernel_aarch64_dist || exit 1
                strings ./bazel-bin/common/kernel_aarch64/Image | grep 'Linux version'
              fi

              echo "Current latest KSU commit date: ${KSU_LATEST_COMMIT_DATE}"
              echo "Current latest SUSFS commit date: ${SUSFS_LATEST_COMMIT_DATE}"
              echo "If the dates differ or are too far apart, the patch fails and compilation fails"
            } 2>&1 | tee "$LOG_FILE"

            BUILD_STATUS=${PIPESTATUS[0]}
            {
              echo "End time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "Exit code: $BUILD_STATUS"
            } >> "$LOG_FILE"
            exit "$BUILD_STATUS"

      - name: Organize failed build logs
        if: ${{ always() && steps.compile_kernel.outcome == 'failure' }}
        env:
          COMPILE_ATTEMPTS: ${{ steps.compile_kernel.outputs.total_attempts }}
          COMPILE_EXIT_CODE: ${{ steps.compile_kernel.outputs.exit_code }}
        run: |
          LOG_DIR="$GITHUB_WORKSPACE/build-logs"
          mkdir -p "$LOG_DIR"

          {
            echo "Android version: ${{ inputs.android_version }}"
            echo "Kernel version: ${{ inputs.kernel_version }}.${{ inputs.sub_level }}"
            echo "Security patch level: ${{ inputs.os_patch_level }}"
            echo "KernelSU variant: ${{ inputs.ksu_variant }}"
            echo "Configuration name: ${CONFIG:-unknown}"
            echo "Git commit: $GITHUB_SHA"
            echo "Workflow URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Number of build attempts: ${COMPILE_ATTEMPTS:-unknown}"
            echo "Final exit code: ${COMPILE_EXIT_CODE:-unknown}"
            echo "KSU commit date: ${KSU_LATEST_COMMIT_DATE:-unknown}"
            echo "SUSFS commit date: ${SUSFS_LATEST_COMMIT_DATE:-unknown}"
          } > "$LOG_DIR/summary.txt"

          printf '%s\n' "${{ inputs.ksu_variant }}_kernel-${CONFIG}-Build-Logs" > "$LOG_DIR/artifact-name.txt"

          df -h "$GITHUB_WORKSPACE" > "$LOG_DIR/disk-usage.txt" 2>&1 || true
          ccache -s > "$LOG_DIR/ccache-stats.txt" 2>&1 || true

      - name: Upload failed build logs
        if: ${{ always() && steps.compile_kernel.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-Build-Logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: Apply KPM patch (patch Image during build)
        if: startsWith(inputs.use_kpm, 'patched') && (inputs.ksu_variant == 'SukiSU' || inputs.ksu_variant == 'BakaSU')
        run: |
          set -e
          if [ "${{ inputs.android_version }}" == "android12" ] || [ "${{ inputs.android_version }}" == "android13" ]; then
            TARGET_PATH="$KERNEL_ROOT/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist"
          else
            TARGET_PATH="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64"
          fi
          echo "KPM patch target directory: $TARGET_PATH"
          if [ ! -f "$TARGET_PATH/Image" ]; then
            echo "::error::$TARGET_PATH/Image not found; unable to apply the KPM patch"
            exit 1
          fi

          cd "$TARGET_PATH"
          # patch_linux is the kptools utility bundled with kpimg; when run without arguments, it reads ./Image and outputs ./oImage
          if ! cp -f "$SUKISU_PATCHES/kpm/patch_linux" ./patch; then
            if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
              echo "::warning title=KPM skipped::KPM patching tool $SUKISU_PATCHES/kpm/patch_linux not found; skipped build-time KPM patching and used the unpatched Image"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **KPM (build-time patching)** automatically skipped: KPM patching tool $SUKISU_PATCHES/kpm/patch_linux not found (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "KPM_SKIPPED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::KPM patching tool $SUKISU_PATCHES/kpm/patch_linux not found"
            exit 1
          fi
          chmod 755 ./patch
          if ! ./patch; then
            if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
              echo "::warning title=KPM skipped::patch_linux execution failed (may be incompatible with the current kernel version); skipped build-time KPM patching and used the unpatched Image"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **KPM (build-time patching)** automatically skipped: patch_linux execution failed (may be incompatible with the current kernel version) (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "KPM_SKIPPED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::KPM patching tool execution failed"
            exit 1
          fi
          if [ ! -f ./oImage ]; then
            if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
              echo "::warning title=KPM skipped::KPM patch did not generate oImage (patch_linux may be incompatible with the current kernel version); skipped build-time KPM patching and used the unpatched Image"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **KPM (build-time patching)** automatically skipped: KPM patch did not generate oImage (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "KPM_SKIPPED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::KPM patch did not generate oImage，patch_linux may be incompatible with the current kernel version"
            exit 1
          fi
          mv -f ./oImage ./Image
          echo "KPM patching completed during the build with kptools"

          # Regenerate lz4 from the patched Image so the boot-lz4 variant also supports KPM
          if [ -f ./Image.lz4 ]; then
            lz4 -f -9 --content-size ./Image ./Image.lz4
            echo "Image.lz4 regenerated from the patched Image"
          fi
          echo "No need to apply the KPM patch again when flashing AnyKernel3 or any boot image"

      - name: Prepare Boot image
        run: |
          mkdir -p bootimgs

          if [ "${{ inputs.android_version }}" == "android12" ] || [ "${{ inputs.android_version }}" == "android13" ]; then
            SRC_DIR="$KERNEL_ROOT/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist"
          else
            SRC_DIR="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64"
          fi

          cp "$SRC_DIR/Image" ./bootimgs/
          cp "$SRC_DIR/Image.lz4" ./bootimgs/
          cp "$SRC_DIR/Image" ./
          cp "$SRC_DIR/Image.lz4" ./
          gzip -n -k -f -9 ./Image > ./Image.gz

      - name: Create AnyKernel3 archive
        if: inputs.artifact_upload_mode == 'Upload all'
        run: |
          cd "$ANYKERNEL3"
          ZIP_NAME="${{ inputs.android_version }}-${{ inputs.kernel_version }}.${NAME_SUBLEVEL}-${{ inputs.os_patch_level }}-AnyKernel3.zip"
          mv ../Image ./Image
          zip -r "../$ZIP_NAME" ./*

      - name: Prepare AnyKernel3 flashable package (upload-only mode)
        if: inputs.artifact_upload_mode != 'Upload all'
        run: |
          mv ./Image "$ANYKERNEL3/Image"
          mkdir -p "$GITHUB_WORKSPACE/AnyKernel3-package"
          cp -a "$ANYKERNEL3/." "$GITHUB_WORKSPACE/AnyKernel3-package/"

      - name: Build Boot image (Android 12)
        if: inputs.android_version == 'android12'
        working-directory: bootimgs
        run: |
          GKI_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-${{ inputs.os_patch_level }}_${{ inputs.revision }}.zip
          FALLBACK_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-2023-01_r1.zip

          status=$(curl -sL -w "%{http_code}" "$GKI_URL" -o /dev/null)
          if [ "$status" = "200" ]; then
            curl -Lo gki-kernel.zip "$GKI_URL"
          else
            curl -Lo gki-kernel.zip "$FALLBACK_URL"
          fi

          unzip gki-kernel.zip && rm gki-kernel.zip
          $UNPACK_BOOTIMG --boot_img="$(pwd)/boot-5.10.img"

          gzip -n -k -f -9 ./Image > ./Image.gz

          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${NAME_SUBLEVEL}-${{ inputs.os_patch_level }}-boot.img

          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${NAME_SUBLEVEL}-${{ inputs.os_patch_level }}-boot-gz.img

          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${NAME_SUBLEVEL}-${{ inputs.os_patch_level }}-boot-lz4.img

      - name: Build Boot image (Android 13+)
        if: inputs.android_version == 'android13' || inputs.android_version == 'android14' || inputs.android_version == 'android15' || inputs.android_version == 'android16'
        working-directory: bootimgs
        run: |
          gzip -n -k -f -9 ./Image > ./Image.gz

          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${NAME_SUBLEVEL}-${{ inputs.os_patch_level }}-boot.img

          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${NAME_SUBLEVEL}-${{ inputs.os_patch_level }}-boot-gz.img

          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${NAME_SUBLEVEL}-${{ inputs.os_patch_level }}-boot-lz4.img

      - name: Collect patch conflict files
        if: always()
        run: |
          REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
          mkdir -p "$REJECTS_DIR"

          mapfile -t REJS < <(find "$KERNEL_ROOT" -type f -name '*.rej')
          REJ_COUNT=${#REJS[@]}
          echo "Found $REJ_COUNT .rej files"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV

          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              REL="${REJ#"$KERNEL_ROOT"/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"

              ORIG="${REJ%.rej}"
              if [ -f "$ORIG" ]; then
                cp "$ORIG" "${DEST%.rej}"
              fi
              echo "$REL" >> "$REJECTS_DIR/index.txt"
            done
          fi

      - name: Upload AnyKernel3 flashable package
        if: inputs.artifact_upload_mode != 'Upload all'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-AnyKernel3
          path: "AnyKernel3-package/*"
          if-no-files-found: error
          compression-level: 9

      - name: Upload all build artifacts
        if: inputs.artifact_upload_mode == 'Upload all'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}
          path: |
            *AnyKernel3.zip
            *.img
          compression-level: 9

      - name: Upload patch conflict files
        if: always() && env.REJ_COUNT > 0
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9
