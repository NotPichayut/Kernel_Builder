# ========================================
# Main entry point for GKI kernel builds
# ========================================
# This workflow is the unified project entry point for:
# 1. Build all GKI kernel versions
# 2. Get the latest KSU manager
# 3. Collect patch conflict files and failed build logs for debugging
# 4. Create a GitHub Release (optional)
# ========================================

name: Build kernel

# Concurrency control: run only one instance per branch; a new run cancels the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== Release configuration ====================
      release_type:
        description: "Release type"
        type: choice
        options:
          - Actions
          - Pre-Release
          - Release
        default: Actions

      # ==================== KernelSU configuration ====================
      kernelsu_variant:
        description: "KernelSU variant"
        type: choice
        options:
          - SukiSU
          - BakaSU
          - FinaSU
        default: FinaSU

      build_channel:
        description: "Build channel (official = official Release; latest = latest upstream commit)"
        type: choice
        options:
          - "Official (Release)"
          - "Latest (HEAD)"
        default: "Official (Release)"

      # ==================== Optional configuration ====================
      version:
        description: "Custom version name (optional)"
        type: string
        default: ""
        required: false
      build_time:
        description: "Custom build time (leave blank to use the current Beijing time automatically; example: Tue Dec  1 08:10:00 UTC 2026)"
        type: string
        default: ""
        required: false
      # ==================== Option configuration ====================
      use_kpm:
        description: "KPM feature (supported by SukiSU only)"
        type: choice
        default: "disabled (off)"
        options:
          - "disabled (off)"
          - "enabled (on)"
          - "patched (on with patch)"
      droidspaces:
        description: "Droidspaces container support (5.10–6.6: slot patch; 6.12: on/off)"
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      droidspaces_ntsync:
        description: "Enable NTSync support for the Droidspaces container (requires Droidspaces)"
        type: boolean
        default: false
      artifact_upload_mode:
        description: "Build artifact upload mode"
        required: true
        type: choice
        options:
          - "Upload AnyKernel3.zip only"
          - "Upload all"
        default: "Upload AnyKernel3.zip only"

      # ==================== Feature toggles ====================
      use_zram:
        description: "Enable the ZRAM compression algorithm"
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG baseband protection"
        type: boolean
        default: false
      use_net_enhance:
        description: "Enable network enhancements (BBRv3 + IPSet + Qdisc + CIFS)"
        type: boolean
        default: false
      use_rekernel:
        description: "Enable the Re-Kernel driver"
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply the CVE-2026-43499 rtmutex fix series"
        type: boolean
        default: false
      cancel_susfs:
        description: "Disable SUSFS"
        type: boolean
        default: false

      # ==================== compatibility ====================
      skip_incompatible:
        description: "Automatically skip features that are incompatible or unavailable (without interrupting the build)"
        type: boolean
        default: false

      # ==================== Build version selection ====================
      build_a12_5_10:
        description: "Android 12 - 5.10"
        type: boolean
        default: false
      build_a13_5_15:
        description: "Android 13 - 5.15"
        type: boolean
        default: false
      build_a14_6_1:
        description: "Android 14 - 6.1"
        type: boolean
        default: false
      build_a15_6_6:
        description: "Android 15 - 6.6"
        type: boolean
        default: false
      build_a16_6_12:
        description: "Android 16 - 6.12"
        type: boolean
        default: false
      build_all:
        description: "Build all versions"
        type: boolean
        default: true

jobs:
  # ==================== Get manager ====================
  # Download the latest KernelSU manager APK and SUSFS module
  get-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}

  # ==================== Android 12 - 5.10 build ====================
  build-a12-5-10:
    needs: [get-manager]
    # A manager fetch failure does not block the build (if ksuCommit is empty, the kernel follows main HEAD)
    if: ${{ !cancelled() && (inputs.build_a12_5_10 || inputs.build_all) }}
    uses: ./.github/workflows/kernel-a12-5-10.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      ksu_commit: ${{ needs.get-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-manager.outputs.managerCertHash }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      called_from_main: true

  # ==================== Android 13 - 5.15 build ====================
  build-a13-5-15:
    needs: [get-manager]
    # A manager fetch failure does not block the build (if ksuCommit is empty, the kernel follows main HEAD)
    if: ${{ !cancelled() && (inputs.build_a13_5_15 || inputs.build_all) }}
    uses: ./.github/workflows/kernel-a13-5-15.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      ksu_commit: ${{ needs.get-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-manager.outputs.managerCertHash }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      called_from_main: true

  # ==================== Android 14 - 6.1 build ====================
  build-a14-6-1:
    needs: [get-manager]
    # A manager fetch failure does not block the build (if ksuCommit is empty, the kernel follows main HEAD)
    if: ${{ !cancelled() && (inputs.build_a14_6_1 || inputs.build_all) }}
    uses: ./.github/workflows/kernel-a14-6-1.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      ksu_commit: ${{ needs.get-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-manager.outputs.managerCertHash }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      called_from_main: true

  # ==================== Android 15 - 6.6 build ====================
  build-a15-6-6:
    needs: [get-manager]
    # A manager fetch failure does not block the build (if ksuCommit is empty, the kernel follows main HEAD)
    if: ${{ !cancelled() && (inputs.build_a15_6_6 || inputs.build_all) }}
    uses: ./.github/workflows/kernel-a15-6-6.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      ksu_commit: ${{ needs.get-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-manager.outputs.managerCertHash }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      called_from_main: true

  # ==================== Android 16 - 6.12 build ====================
  build-a16-6-12:
    needs: [get-manager]
    # A manager fetch failure does not block the build (if ksuCommit is empty, the kernel follows main HEAD)
    if: ${{ !cancelled() && (inputs.build_a16_6_12 || inputs.build_all) }}
    uses: ./.github/workflows/kernel-a16-6-12.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      ksu_commit: ${{ needs.get-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-manager.outputs.managerCertHash }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      called_from_main: true

  # ==================== Collect patch conflict files ====================
  # Aggregate .rej files from all build jobs to help debug patch issues
  collect-rejects:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs:
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
    steps:
      - name: Download conflict files
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          pattern: '*-Rejects'

      - name: Process conflict files
        run: |
          mkdir -p aio-rejects
          for dir in ./downloaded-artifacts/*-Rejects; do
            [ -d "$dir" ] || continue
            dirname=$(basename "$dir")
            original_name=${dirname%-Rejects}
            mkdir -p "aio-rejects/$original_name"
            cp -r "$dir/." "aio-rejects/$original_name/"
          done
          if [ "$(ls -A aio-rejects 2>/dev/null)" ]; then
            cd aio-rejects && zip -r -q -9 ../AIO-REJ.zip . && cd ..
          fi

      - name: Upload aggregated conflict files
        uses: actions/upload-artifact@v6
        with:
          name: AIO-REJ
          path: AIO-REJ.zip
          if-no-files-found: ignore

  # ==================== Collect failed build logs ====================
  # Aggregate failed logs by build name for convenient download and troubleshooting
  collect-build-logs:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs:
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
    steps:
      - name: Download failed build logs
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-build-logs
          pattern: '*-Build-Logs'
          merge-multiple: false

      - name: Process failed build logs
        run: |
          mkdir -p aio-build-logs
          found_logs=false
          for dir in ./downloaded-build-logs/*-Build-Logs; do
            [ -d "$dir" ] || continue
            artifact_name=$(basename "$dir")
            mkdir -p "aio-build-logs/$artifact_name"
            cp -r "$dir/." "aio-build-logs/$artifact_name/"
            found_logs=true
          done

          # download-artifact extracts directly into the target directory when only one artifact matches
          if [ "$found_logs" = false ] && [ -f ./downloaded-build-logs/artifact-name.txt ]; then
            read -r artifact_name < ./downloaded-build-logs/artifact-name.txt
            artifact_name=$(basename "$artifact_name")
            if [ -n "$artifact_name" ]; then
              mkdir -p "aio-build-logs/$artifact_name"
              cp -r ./downloaded-build-logs/. "aio-build-logs/$artifact_name/"
            fi
          fi

          if [ "$(ls -A aio-build-logs 2>/dev/null)" ]; then
            cd aio-build-logs
            zip -r -q -9 ../AIO-BUILD-LOGS.zip .
          fi

      - name: Upload aggregated failed build logs
        id: upload_aggregated_build_logs
        uses: actions/upload-artifact@v6
        with:
          name: AIO-BUILD-LOGS
          path: AIO-BUILD-LOGS.zip
          if-no-files-found: ignore

      - name: Delete individual failed build logs
        if: steps.upload_aggregated_build_logs.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete intermediate artifacts after the aggregated artifact uploads successfully to avoid using space twice
          if ! ARTIFACT_IDS=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | endswith("-Build-Logs")) | .id'); then
            echo "::warning::Failed to get the list of individual failed build logs; skipping cleanup"
            exit 0
          fi

          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            if gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > /dev/null; then
              echo "Deleted intermediate log artifact: $artifact_id"
            else
              echo "::warning::delete intermediate log artifact $artifact_id failed"
            fi
          done <<< "$ARTIFACT_IDS"

  # ==================== Create release ====================
  # Create a GitHub Release when release_type is not Actions
  # When the Release type is Actions, upload Artifacts only and do not create a Release
  release:
    if: ${{ always() && !cancelled() && inputs.release_type != 'Actions' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    needs:
      - get-manager
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12

    # ==================== Environment variables ====================
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ==================== Set display names ====================
      # Precompute display names to simplify later references
      - name: Set display names
        run: |
          # KSU display names
          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU")    KSU_NAME="SukiSU" ;;
            "BakaSU")  KSU_NAME="BakaSU" ;;
            "FinaSU")  KSU_NAME="FinaSU" ;;
          esac
          echo "KSU_NAME=$KSU_NAME" >> $GITHUB_ENV

          # Version information（when the kernel is aligned with the official uploaded build, the actual kernel KSU version = managerVer，
          #fall back to ksuVer when managerVer is empty (manager fetch failed)）
          KSU_VER="${{ needs.get-manager.outputs.managerVer }}"
          if [ -z "$KSU_VER" ]; then
            KSU_VER="${{ needs.get-manager.outputs.ksuVer }}"
          fi
          SUS_VER="${{ needs.get-manager.outputs.susVer }}"
          echo "KSU_VER=$KSU_VER" >> $GITHUB_ENV
          echo "SUS_VER=$SUS_VER" >> $GITHUB_ENV

          # Feature toggle display values
          echo "LZ4_STATUS=${{ inputs.use_zram && 'on' || 'disabled' }}" >> $GITHUB_ENV
          echo "BBG_STATUS=${{ inputs.use_bbg && 'on' || 'disabled' }}" >> $GITHUB_ENV
          echo "REKERNEL_STATUS=${{ inputs.use_rekernel && 'on' || 'disabled' }}" >> $GITHUB_ENV
          if [[ "${{ inputs.use_kpm }}" == enabled* ]]; then
            echo "KPM_STATUS=enabled (unpatched)" >> $GITHUB_ENV
          elif [[ "${{ inputs.use_kpm }}" == patched* ]]; then
            echo "KPM_STATUS=enabled (patched during build)" >> $GITHUB_ENV
          else
            echo "KPM_STATUS=disabled" >> $GITHUB_ENV
          fi

          # Droidspaces container support (including NTSync)
          if [ "${{ inputs.droidspaces }}" = "off" ]; then
            echo "DROIDSPACES_STATUS=disabled" >> $GITHUB_ENV
          elif [ "${{ inputs.droidspaces_ntsync }}" = "true" ]; then
            echo "DROIDSPACES_STATUS=enabled (NTSync)" >> $GITHUB_ENV
          else
            echo "DROIDSPACES_STATUS=on" >> $GITHUB_ENV
          fi

          # network enhancements (BBRv3 / IPSet / Qdisc / CIFS)
          echo "NET_ENHANCE_STATUS=${{ inputs.use_net_enhance && 'on' || 'disabled' }}" >> $GITHUB_ENV

          # Hook type
          echo "HOOK_TYPE=SUSFS Inline Hooks" >> $GITHUB_ENV

          # Mount type（FinaSU uses the metamodule architecture）
          if [ "${{ inputs.kernelsu_variant }}" == "FinaSU" ]; then
            echo "MOUNT_TYPE=Metamodule" >> $GITHUB_ENV
          else
            echo "MOUNT_TYPE=Magic Mount" >> $GITHUB_ENV
          fi

          # Release title and body heading
          echo "RELEASE_NAME=GKI Kernel: ${KSU_NAME} ${KSU_VER} + SUSFS ${SUS_VER}" >> $GITHUB_ENV
          echo "RELEASE_HEADER=**${KSU_NAME} ${KSU_VER}** + **SUSFS ${SUS_VER}**" >> $GITHUB_ENV

      # ==================== Verify build status ====================
      # Ensure all selected build jobs completed successfully
      - name: Verify build status
        run: |
          failed=0
          check_build() {
            local selected="$1" job_name="$2" result="$3"
            if [[ "$selected" == "true" && "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Selected build job $job_name failed (result: $result)"
              failed=1
            fi
          }
          check_build "${{ inputs.build_a12_5_10 || inputs.build_all }}" "build-a12-5-10" "${{ needs.build-a12-5-10.result }}"
          check_build "${{ inputs.build_a13_5_15 || inputs.build_all }}" "build-a13-5-15" "${{ needs.build-a13-5-15.result }}"
          check_build "${{ inputs.build_a14_6_1 || inputs.build_all }}" "build-a14-6-1" "${{ needs.build-a14-6-1.result }}"
          check_build "${{ inputs.build_a15_6_6 || inputs.build_all }}" "build-a15-6-6" "${{ needs.build-a15-6-6.result }}"
          check_build "${{ inputs.build_a16_6_12 || inputs.build_all }}" "build-a16-6-12" "${{ needs.build-a16-6-12.result }}"
          [[ "$failed" -ne 0 ]] && exit 1 || true

      # ==================== Check out code ====================
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # ==================== Determine KSU ref ====================
      # Determine the upstream KernelSU ref based on the actual build logic
      - name: Determine KSU ref
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU")
              if [ "${{ inputs.cancel_susfs }}" = "true" ]; then
                BRANCH="main"
              else
                BRANCH="builtin"
              fi
              ;;
            "BakaSU") BRANCH="main" ;;
            "FinaSU") BRANCH="master" ;;
            *) echo "Error:  Unknown variant" >&2; exit 1 ;;
          esac
          echo "KSU_BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "BRANCH_INFO=$BRANCH" >> $GITHUB_ENV
          # Release tag used by the official channel (empty for latest channel)
          echo "CHANNEL_TAG=${{ needs.get-manager.outputs.channelTag }}" >> $GITHUB_ENV
          echo "CHANNEL_NAME=${{ inputs.build_channel }}" >> $GITHUB_ENV

      # ==================== Get KernelSU commit information ====================
      # Get Git commit information for the currently used KernelSU version
      - name: Get KernelSU commit information
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU") REPO_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"; REPO_URL2="SukiSU-Ultra/SukiSU-Ultra" ;;
            "BakaSU") REPO_URL="https://github.com/Baka-SU/BakaSU.git"; REPO_URL2="Baka-SU/BakaSU" ;;
            "FinaSU") REPO_URL="https://github.com/LyraVoid/FinaSU.git"; REPO_URL2="LyraVoid/FinaSU" ;;
          esac

          if [ "${{ inputs.kernelsu_variant }}" = "SukiSU" ] && [ -f "config/config" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" config/config | cut -d'=' -f2)
            CUSTOM_COMMIT=$(grep "^sukisu=" config/config | cut -d'=' -f2)
            if [ "$CUSTOM_ENABLED" = "true" ] && [ -n "$CUSTOM_COMMIT" ]; then
              KSU_REF="$CUSTOM_COMMIT"
              KSU_URL="https://github.com/$REPO_URL2/commit/$CUSTOM_COMMIT"
              echo "BRANCH_INFO=custom" >> $GITHUB_ENV
            fi
          fi

          if [ -z "${KSU_REF:-}" ] && [ -n "${CHANNEL_TAG:-}" ]; then
            # Official channel: Use the commit referenced by the Release tag (dereference annotated tags first)
            COMMIT_HASH=$(git ls-remote $REPO_URL "refs/tags/${CHANNEL_TAG}^{}" | awk '{ print $1 }')
            if [ -z "$COMMIT_HASH" ]; then
              COMMIT_HASH=$(git ls-remote $REPO_URL "refs/tags/${CHANNEL_TAG}" | awk '{ print $1 }')
            fi
            if [ -n "$COMMIT_HASH" ]; then
              KSU_REF=$COMMIT_HASH
              KSU_URL="https://github.com/$REPO_URL2/releases/tag/$CHANNEL_TAG"
              echo "BRANCH_INFO=release/${CHANNEL_TAG}" >> $GITHUB_ENV
            fi
          fi

          if [ -z "${KSU_REF:-}" ]; then
            COMMIT_HASH=$(git ls-remote $REPO_URL refs/heads/${KSU_BRANCH:-main} | awk '{ print $1 }')
            KSU_REF=$COMMIT_HASH
            KSU_URL="https://github.com/$REPO_URL2/commit/$COMMIT_HASH"
          fi

          echo "KSU_REF=$KSU_REF" >> $GITHUB_ENV
          echo "KSU_URL=$KSU_URL" >> $GITHUB_ENV

      # ==================== Get SUSFS commit information ====================
      # Get Git commit information for each SUSFS version
      - name: Get SUSFS commit information
        run: |
          GITLAB_OWNER="simonpunk"
          GITLAB_REPO="susfs4ksu"
          declare -A BRANCH_MAP=(
            ["gki_android12_5_10"]="gki-android12-5.10"
            ["gki_android13_5_15"]="gki-android13-5.15"
            ["gki_android14_6_1"]="gki-android14-6.1"
            ["gki_android15_6_6"]="gki-android15-6.6"
            ["gki_android16_6_12"]="gki-android16-6.12"
          )
          for var_name in "${!BRANCH_MAP[@]}"; do
            branch_name="${BRANCH_MAP[$var_name]}"
            COMMIT_HASH=$(git ls-remote https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO.git refs/heads/$branch_name | awk '{ print $1 }')
            if [[ -n "$COMMIT_HASH" ]]; then
              COMMIT_URL="https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO/-/commit/$COMMIT_HASH"
              echo "COMMIT_HASH_${var_name}=$COMMIT_HASH" >> "$GITHUB_ENV"
              echo "COMMIT_URL_${var_name}=$COMMIT_URL" >> "$GITHUB_ENV"
            fi
          done

      # ==================== Generate release notes ====================
      # Create detailed release notes
      - name: Generate release notes
        run: |
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          if [[ "$KSU_REF" =~ ^[0-9a-f]{40}$ ]]; then
            KSU_DISPLAY_REF="${KSU_REF:0:7}"
          else
            KSU_DISPLAY_REF="$KSU_REF"
          fi

          build_targets=""
          append_target() {
            local selected="$1" label="$2"
            if [[ "$selected" == "true" ]]; then
              if [[ -z "$build_targets" ]]; then
                build_targets="$label"
              else
                build_targets="$build_targets, $label"
              fi
            fi
          }
          append_target "${{ inputs.build_a12_5_10 || inputs.build_all }}" "Android 12 / 5.10"
          append_target "${{ inputs.build_a13_5_15 || inputs.build_all }}" "Android 13 / 5.15"
          append_target "${{ inputs.build_a14_6_1 || inputs.build_all }}" "Android 14 / 6.1"
          append_target "${{ inputs.build_a15_6_6 || inputs.build_all }}" "Android 15 / 6.6"
          append_target "${{ inputs.build_a16_6_12 || inputs.build_all }}" "Android 16 / 6.12"
          if [[ -z "$build_targets" ]]; then
            build_targets="not selected"
          fi

          : > susfs_commits.md
          append_susfs_commit() {
            local selected="$1" label="$2" hash="$3" url="$4"
            if [[ "$selected" == "true" && -n "$hash" && -n "$url" ]]; then
              printf -- '- %s: [`%s`](%s)\n' "$label" "${hash:0:7}" "$url" >> susfs_commits.md
            fi
          }
          append_susfs_commit "${{ inputs.build_a12_5_10 || inputs.build_all }}" "Android 12 / 5.10" "${COMMIT_HASH_gki_android12_5_10}" "${COMMIT_URL_gki_android12_5_10}"
          append_susfs_commit "${{ inputs.build_a13_5_15 || inputs.build_all }}" "Android 13 / 5.15" "${COMMIT_HASH_gki_android13_5_15}" "${COMMIT_URL_gki_android13_5_15}"
          append_susfs_commit "${{ inputs.build_a14_6_1 || inputs.build_all }}" "Android 14 / 6.1" "${COMMIT_HASH_gki_android14_6_1}" "${COMMIT_URL_gki_android14_6_1}"
          append_susfs_commit "${{ inputs.build_a15_6_6 || inputs.build_all }}" "Android 15 / 6.6" "${COMMIT_HASH_gki_android15_6_6}" "${COMMIT_URL_gki_android15_6_6}"
          append_susfs_commit "${{ inputs.build_a16_6_12 || inputs.build_all }}" "Android 16 / 6.12" "${COMMIT_HASH_gki_android16_6_12}" "${COMMIT_URL_gki_android16_6_12}"
          if [[ ! -s susfs_commits.md ]]; then
            echo "- No SUSFS commit information found for this build" > susfs_commits.md
          fi

          cat > release_body.md << EOF
          ## GKI Kernel Release

          $RELEASE_HEADER

          | Item | Content |
          |:---|:---|
          | Release type | ${{ inputs.release_type }} |
          | Build channel | $CHANNEL_NAME |
          | Release time | $BUILD_DATE |
          | Build scope | $build_targets |

          ### buildconfiguration

          | Item | Content |
          |:---|:---|
          | KernelSU variant | $KSU_NAME |
          | KernelSU version | $KSU_VER |
          | KernelSU branch | $BRANCH_INFO |
          | SUSFS | $SUS_VER |
          | Hook type | $HOOK_TYPE |
          | Mount method | $MOUNT_TYPE |
          | LTO | thin |
          | ZRAM / LZ4KD | $LZ4_STATUS |
          | BBG baseband protection | $BBG_STATUS |
          | network enhancements (BBRv3 / IPSet / Qdisc / CIFS) | $NET_ENHANCE_STATUS |
          | Re-Kernel driver | $REKERNEL_STATUS |
          | KPM | $KPM_STATUS |
          | Droidspaces container support | $DROIDSPACES_STATUS |

          ### Download instructions

          Download the corresponding files from **Assets** below.

          | File type | Purpose |
          |:---|:---|
          | \`*_kernel-*.zip\` | AnyKernel3 kernel flashable package |
          | \`*.img\` | boot, vendor_boot, and other image files |
          | \`*.apk\` | Root manager |
          | \`susfs-*.zip\` | SUSFS companion module |

          > [!IMPORTANT]
          > Back up the stock Boot image before flashing.
          > If the device cannot boot, restore the stock image first, then extract the KernelSU logs and report the issue.

          <details>
          <summary>Post-flash steps</summary>

          ### Normal boot

          After installing or updating the KernelSU manager, check that root, modules, and SUSFS are working properly.

          ### Unable to boot

          1. Restore the stock Boot image
          2. Use the KernelSU manager or recovery to extract logs
          3. Submit to [Issues](${{ github.server_url }}/${{ github.repository }}/issues)，and include the device model, Android version, kernel version, and flashed file name

          </details>

          <details>
          <summary>Upstream commit information</summary>

          **KernelSU**

          - $KSU_NAME: [\`$KSU_DISPLAY_REF\`]($KSU_URL)

          **SUSFS4KSU**

          $(cat susfs_commits.md)

          </details>

          ---

          Recommended module: https://github.com/sidex15/ksu_module_susfs

          Unicode zero-width bypass fix: use the Xposed module: https://github.com/5ec1cff/FuseFixer
          EOF

      # ==================== Generate release tag ====================
      # Generate an incrementing release tag based on the SUSFS version
      - name: Generate release tag
        run: |
          # Get SUSFS version; use the default if get-manager was skipped
          SUS_VERSION="${{ needs.get-manager.outputs.susVer }}"
          if [ -z "$SUS_VERSION" ]; then
            echo "Warning: SUSFS version not found; using default version"
            SUS_VERSION="1.0.0"
          fi

          # Query the latest full tag with retries; fall back to empty on failure
          FULL_TAG=""
          for i in 1 2 3; do
            FULL_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name' 2>/dev/null) && [ -n "$FULL_TAG" ] && break
            FULL_TAG=""
            sleep 3
          done

          if [ -n "$FULL_TAG" ] && [ "$(echo "$FULL_TAG" | sed 's/-.*//')" = "$SUS_VERSION" ]; then
            BASE_TAG="$FULL_TAG"
          else
            BASE_TAG="$SUS_VERSION-r0"
          fi

          NEW_TAG=$(echo "$BASE_TAG" | awk -F'-r' '{suffix=$2; if (!suffix) suffix=0; suffix++; printf "%s-r%d", $1, suffix}')

          # Guard against malformed tags (e.g. "-r1" when the lookup failed)
          if [[ ! "$NEW_TAG" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Tag generation failed; falling back to $SUS_VERSION-r1"
            NEW_TAG="$SUS_VERSION-r1"
          fi
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Generated tag: $NEW_TAG"

      # ==================== Download build artifacts ====================
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts

      # ==================== Create GitHub Release ====================
      - name: Create GitHub Release
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.release_type }}" == "Pre-Release" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          for i in 1 2 3; do
            if gh release view "$NEW_TAG" > /dev/null 2>&1; then
              echo "Release $NEW_TAG already exists; skipping creation"
              break
            fi
            if gh release create "$NEW_TAG" \
              --title "$RELEASE_NAME" \
              --notes-file release_body.md \
              --target "$GITHUB_SHA" \
              $PRERELEASE_FLAG; then
              break
            fi
            [ "$i" = 3 ] && exit 1
            echo "Failed to create Release; retrying in 10 seconds ($i/3)..."
            sleep 10
          done

      # ==================== Upload manager and module ====================
      - name: Upload manager and SUSFS module
        continue-on-error: true
        run: |
          echo "Preparing to upload APK and SUSFS module..."
          apk_count=$(find ./downloaded-artifacts -type f -name "*.apk" | wc -l || true)
          sus_count=$(find ./downloaded-artifacts -type f -path "./downloaded-artifacts/susfs-*/*" | wc -l || true)
          echo "APK files: ${apk_count}"
          echo "SUSFS files: ${sus_count}"
          find ./downloaded-artifacts -type f -name "*.apk" -print0 | \
          while IFS= read -r -d '' f; do
            gh release upload "$NEW_TAG" "$f" || true
          done
          find ./downloaded-artifacts -type f -path "./downloaded-artifacts/susfs-*/*" -print0 | \
          while IFS= read -r -d '' f; do
            gh release upload "$NEW_TAG" "$f" || true
          done

      # ==================== Upload kernel artifacts ====================
      - name: Upload kernel artifacts
        run: |
          # In upload-only mode, the artifact contains loose flashable files: package them as a complete AnyKernel3 archive and upload only the zip,
          # to avoid filename conflicts between loose files (Image/anykernel.sh...) from multiple versions in the Release;
          # in upload-all mode (zip + img already in the directory), upload files individually so they do not conflict.
          # --clobber ensures assets with the same name are overwritten rather than failing when a job is rerun.
          for dir in ./downloaded-artifacts/*_kernel-*/; do
            [ -d "$dir" ] || continue
            [[ "$dir" == *-Rejects/ ]] && continue
            if ! ls "$dir"*.zip >/dev/null 2>&1; then
              (cd "$dir" && zip -r -q -9 "$(basename "$dir").zip" .)
              echo "Upload $(basename "$dir").zip..."
              gh release upload "$NEW_TAG" "$dir/$(basename "$dir").zip" --clobber
            else
              for file in "$dir"*; do
                [ -f "$file" ] || continue
                echo "Upload $file..."
                gh release upload "$NEW_TAG" "$file" --clobber
              done
            fi
          done

      # ==================== Build summary ====================
      - name: Build summary
        run: |
          echo "## Release created" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: $NEW_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ inputs.release_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Link**: https://github.com/$REPO_OWNER/$REPO_NAME/releases/tag/$NEW_TAG" >> $GITHUB_STEP_SUMMARY
