name: GetManager
permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: read   # Allows triggering actions

on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      kernelsu_variant:
        required: true
        type: string
      build_channel:
        description: "Build channel: Official (Release) aligns with the official release; Latest (HEAD) follows the latest upstream commit"
        required: false
        type: string
        default: "Official (Release)"
    outputs:
      susVer:
        description: "The fetched SUSFS version number"
        value: ${{ jobs.get_ksu_manager.outputs.susVer }}

      ksuVer:
        description: "The calculated KSU version number"
        value: ${{ jobs.get_ksu_manager.outputs.ksuVer }}

      managerVer:
        description: "Measured version of the official Manager build"
        value: ${{ jobs.get_ksu_manager.outputs.managerVer }}

      ksuCommit:
        description: "Commit SHA used to align the kernel (official channel = Release tag commit; latest channel = empty)"
        value: ${{ jobs.get_ksu_manager.outputs.ksuCommit }}

      channelTag:
        description: "Release tag selected for the official channel (empty for latest channel or fallback)"
        value: ${{ jobs.get_ksu_manager.outputs.channelTag }}

      managerCertSize:
        description: "FinaSU manager signing certificate DER size (0x hexadecimal; used to align the kernel second trust slot)"
        value: ${{ jobs.get_ksu_manager.outputs.managerCertSize }}

      managerCertHash:
        description: "FinaSU manager signing certificate SHA256 (used to align the kernel second trust slot)"
        value: ${{ jobs.get_ksu_manager.outputs.managerCertHash }}

jobs:
  get_ksu_manager:
    runs-on: ubuntu-latest
    outputs:
      # Output 1: KSU version
      ksuVer: ${{ steps.get_version.outputs.kversion }}
      # Output 2: SUSFS version
      susVer: ${{ steps.get_version.outputs.sversion }}
      # Output 3: measured Manager version
      managerVer: ${{ steps.add_KSU.outputs.managerVer }}
      # Output 4: Commit SHA used to align the kernel (official channel = Release tag commit; latest channel = empty)
      ksuCommit: ${{ steps.add_KSU.outputs.ksuCommit }}
      # Output 5: Release tag selected for the official channel
      channelTag: ${{ steps.add_KSU.outputs.channelTag }}
      # Output 6/7: FinaSU manager signing certificate (used to align the kernel second trust slot)
      managerCertSize: ${{ steps.add_KSU.outputs.managerCertSize }}
      managerCertHash: ${{ steps.add_KSU.outputs.managerCertHash }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out the scripts repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl jq unzip

      - name: get KSU & SUSFS version
        id: get_version
        run: |

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "This is the SukiSU variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]; then
            echo "This is the BakaSU variant"
            git clone https://github.com/Baka-SU/BakaSU.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "FinaSU" ]; then
            echo "This is the FinaSU variant"
            git clone https://github.com/LyraVoid/FinaSU.git KernelSU
          else
            echo "Unknown variant"
            exit 1
          fi

          cd KernelSU

          # Calculate the KSU version
          KSU_GIT_VERSION=$(git rev-list --count HEAD)

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            KSU_VERSION=$((40000 + KSU_GIT_VERSION - 2815))
          elif [ "${{ inputs.kernelsu_variant }}" == "FinaSU" ]; then
            # FinaSU kernel Kbuild and manager build.gradle.kts both calculate the version as 30000 + Git commit count
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          else
            KSU_VERSION=$((30700 + KSU_GIT_VERSION))
          fi
          echo $KSU_VERSION
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

          # Calculate the SUSFS version
          INFO="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop"
          SUS_VERSION=$(curl -s $INFO | awk -F '=' '$1 == "version" { print $2 }')
          echo $SUS_VERSION

          # Export these two values for release
          echo "kversion=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "sversion=$SUS_VERSION" >> $GITHUB_OUTPUT

      # ==================== Build channel ====================
      # Official: use the official Release manager (prerelease=false, tag commit + APK from that Release);
      #       If upstream has no official Release (for example, BakaSU has only an rc prerelease),
      #       use the latest uploaded build from the official default branch; the kernel remains pinned to that build commit
      # Latest: use the latest manager build whose version matches the default branch HEAD (any branch); pin the kernel to that HEAD
      - name: selectmanager source（Build channel）
        id: channel
        run: |

          CHANNEL_RAW="${{ inputs.build_channel }}"
          case "$CHANNEL_RAW" in
            Latest*|latest*|HEAD*) CHANNEL_KIND="latest"; PIN_MODE="head" ;;
            *)                   CHANNEL_KIND="release"; PIN_MODE="pin" ;;
          esac
          echo "Build channel: $CHANNEL_RAW -> $CHANNEL_KIND (pin_mode=$PIN_MODE)"

          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU") REPO="SukiSU-Ultra/SukiSU-Ultra"; PREF="universal" ;;
            "BakaSU") REPO="Baka-SU/BakaSU";           PREF="arm64" ;;
            "FinaSU") REPO="LyraVoid/FinaSU";          PREF="universal" ;;
            *) echo "::error::Unknown variant"; exit 1 ;;
          esac

          {
            echo "CHANNEL_KIND=$CHANNEL_KIND"
            echo "PIN_MODE=$PIN_MODE"
            echo "MANAGER_REPO=$REPO"
            echo "MANAGER_SOURCE=ci"
          } >> "$GITHUB_ENV"

          if [ "$CHANNEL_KIND" != "release" ]; then
            echo "Latest channel: kernel is pinned to the default branch HEAD; use the latest manager build with a matching version"
            exit 0
          fi

          # ---------- Official channel: resolveofficial Release ----------
          REL_JSON=""
          for ATTEMPT in 1 2 3; do
            REL_JSON=$(curl -s --fail --max-time 30 \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases?per_page=40") \
              && [ -n "$REL_JSON" ] && break
            echo "Failed to get the Release list for $REPO，retry ($ATTEMPT/3)..."
            REL_JSON=""
            sleep 5
          done

          # Selection rules:
          #   1) Skip drafts and rolling release tags (manager-ci / nightly / latest, etc., which always contain the latest CI artifacts)
          #   2) Keep only Releases with APK assets (exclude debug / spoofed packages)
          #   3) Accept only official releases (prerelease=false): rc / beta prereleases are considered "latest" and are not used by the official channel
          #   4) ABI preference: use arm64-v8a for BakaSU; prefer universal for others
          PICK=""
          if [ -n "$REL_JSON" ]; then
            PICK=$(printf '%s' "$REL_JSON" | jq -r --arg pref "$PREF" '
              [ .[] | select(.draft == false) ]
              | map(. + { _ts: (.published_at // .created_at // "") })
              | sort_by(._ts) | reverse
              | map(. + {
                  _rolling: (.tag_name | test("(?i)^(manager-ci|manager_ci|nightly|latest|ci)$")),
                  _apks: [ .assets[]?
                           | select(.name | test("\\.apk$"; "i"))
                           | select(.name | test("(?i)debug|spoofed") | not) ]
                })
              | map(. + {
                  _apks: (._apks | sort_by(
                    if   (.name | test("(?i)" + $pref)) then 0
                    elif (.name | test("(?i)universal")) then 1
                    elif (.name | test("(?i)arm64")) then 2
                    else 3 end))
                })
              | map(select((._rolling | not) and ((._apks | length) > 0)))
              | map(select(.prerelease | not))
              | .[0] as $p
              | if $p then
                  [ $p.tag_name, ( $p.prerelease | tostring ), $p._apks[0].name, $p._apks[0].browser_download_url ] | @tsv
                else empty end
            ')
          fi

          if [ -z "$PICK" ]; then
            echo "::notice::$REPO No usable official Release is available (only prereleases or no APK attached); use the latest uploaded build from the official default branch (kernel remains pinned to that commit)"
            exit 0
          fi

          IFS=$'\t' read -r REL_TAG REL_PRE REL_APK_NAME REL_APK_URL <<< "$PICK"

          # Resolve the commit for the Release tag (prefer the local clone, fall back to a remote query)
          REL_COMMIT=$(git -C KernelSU rev-parse "${REL_TAG}^{commit}" 2>/dev/null || true)
          if [ -z "$REL_COMMIT" ]; then
            # Dereference annotated tags; otherwise the tag object, not the commit, is returned
            REL_COMMIT=$(git ls-remote "https://github.com/$REPO.git" "refs/tags/${REL_TAG}^{}" 2>/dev/null | awk '{print $1}')
          fi
          if [ -z "$REL_COMMIT" ]; then
            REL_COMMIT=$(git ls-remote "https://github.com/$REPO.git" "refs/tags/${REL_TAG}" 2>/dev/null | awk '{print $1}')
          fi
          if [ -z "$REL_COMMIT" ]; then
            echo "::warning title=Official channel fallback::Unable to resolve the commit for Release $REL_TAG; using the latest uploaded build from the official default branch"
            exit 0
          fi

          {
            echo "MANAGER_SOURCE=release"
            echo "REL_TAG=$REL_TAG"
            echo "REL_COMMIT=$REL_COMMIT"
            echo "REL_APK_NAME=$REL_APK_NAME"
            echo "REL_APK_URL=$REL_APK_URL"
          } >> "$GITHUB_ENV"

          if [ "$REL_PRE" = "true" ]; then
            echo "::notice::Upstream has no official release; using the latest prerelease $REL_TAG"
          fi
          echo "Official channel: Release $REL_TAG (${REL_COMMIT:0:8})，manager $REL_APK_NAME"

      - name: Add KernelSU
        id: add_KSU
        continue-on-error: true
        run: |
          VARIANT="${{ inputs.kernelsu_variant }}"

          case "$VARIANT" in
            "SukiSU") REPO="SukiSU-Ultra/SukiSU-Ultra"; KSUM="manager"; EXPECTED_BRANCH="main" ;;
            "BakaSU") REPO="Baka-SU/BakaSU";           KSUM="manager"; EXPECTED_BRANCH="main" ;;
            "FinaSU") REPO="LyraVoid/FinaSU";          KSUM="manager"; EXPECTED_BRANCH="master" ;;
            *) echo "::error::Unknown variant: $VARIANT"; exit 1 ;;
          esac

          # Fallback channel resolution (still determine the channel from input if selection fails)
          CHANNEL_KIND="${CHANNEL_KIND:-}"
          if [ -z "$CHANNEL_KIND" ]; then
            case "${{ inputs.build_channel }}" in
              Latest*|latest*|HEAD*) CHANNEL_KIND="latest" ;;
              *)                   CHANNEL_KIND="release" ;;
            esac
          fi

          mkdir -p manager-artifacts

          # ==================== A. Official channel: official Release manager ====================
          if [ "${MANAGER_SOURCE:-ci}" = "release" ] && [ -n "${REL_APK_URL:-}" ]; then
            echo "Official channel: downloading the manager for Release $REL_TAG ($REL_APK_NAME)..."
            REL_APK="manager-artifacts/$(basename "$REL_APK_NAME")"
            if curl -sL --fail --retry 3 --max-time 300 -o "$REL_APK" "$REL_APK_URL"; then
              # Strip the ABI segment before extracting the version so numeric suffixes such as "_64" in x86_64 are not mistaken for the versionCode
              CLEAN_NAME=$(basename "$REL_APK" | sed -E 's/-(arm64-v8a|armeabi-v7a|armv7|riscv64|x86_64|x86|universal)-release\.apk$/.apk/')
              MANAGER_VERSION=$(echo "$CLEAN_NAME" | grep -oE '_[0-9]+' | tail -n 1 | tr -d '_')
              if [[ "${MANAGER_VERSION:-}" =~ ^[0-9]+$ ]]; then
                echo "Release managerversion: $MANAGER_VERSION（Tag $REL_TAG，commit ${REL_COMMIT:0:8}）"
                echo "MANAGER_VERSION=$MANAGER_VERSION" >> $GITHUB_ENV
                {
                  echo "managerVer=$MANAGER_VERSION"
                  echo "ksuCommit=$REL_COMMIT"
                  echo "channelTag=$REL_TAG"
                } >> $GITHUB_OUTPUT

                # Version consistency check: the KSU version for the Release tag commit should match the manager versionCode
                REL_COUNT=$(git -C KernelSU rev-list --count "$REL_COMMIT" 2>/dev/null || echo "")
                if [ -n "$REL_COUNT" ]; then
                  case "$VARIANT" in
                    SukiSU) REL_KSU_VERSION=$((40000 + REL_COUNT - 2815)) ;;
                    BakaSU) REL_KSU_VERSION=$((30700 + REL_COUNT)) ;;
                    FinaSU) REL_KSU_VERSION=$((30000 + REL_COUNT)) ;;
                  esac
                  if [ "$MANAGER_VERSION" != "$REL_KSU_VERSION" ]; then
                    echo "::warning::Release manager version $MANAGER_VERSION does not match the KSU version $REL_KSU_VERSION for the tag commit"
                  fi
                fi

                if [ "$VARIANT" == "FinaSU" ]; then
                  echo "Extract signing certificate from Release manager APK..."
                  CERT_INFO=$(python3 "$GITHUB_WORKSPACE/scripts/finasu_compat/extract_manager_cert.py" "$REL_APK" | head -n1)
                  if [ -n "$CERT_INFO" ]; then
                    CERT_SIZE=$(echo "$CERT_INFO" | awk '{print $1}')
                    CERT_HASH=$(echo "$CERT_INFO" | awk '{print $2}')
                    echo "managerCertSize=$CERT_SIZE" >> $GITHUB_OUTPUT
                    echo "managerCertHash=$CERT_HASH" >> $GITHUB_OUTPUT
                    echo "Release managercertificate size=$CERT_SIZE sha256=$CERT_HASH"
                  else
                    echo "::warning title=Certificate missing::Unable to extract the signing certificate from the Release manager APK; the kernel will fall back to extracting it"
                  fi
                fi
                exit 0
              fi
              echo "::warning title=Official channel fallback::Unable to parse version from Release manager filename（$(basename "$REL_APK")），fall back to the latest channel"
            else
              echo "::warning title=Official channel fallback::Release managerdownloadfailed，fall back to the latest channel"
            fi
            rm -rf manager-artifacts && mkdir -p manager-artifacts
          fi

          # ==================== B. FinaSU：Release manager（none CI managerartifact） ====================
          if [ "$VARIANT" == "FinaSU" ]; then
            # FinaSU publishes only GitHub Releases (no CI manager artifacts):
            #   latest channel = use the manager/certificate from the latest Release APK; pin the kernel to master HEAD
            #   official fallback = used when the official Release manager is unavailable; pin the kernel to the Release tag commit
            echo "FinaSU: fetching the manager from the latest Release APK..."
            REL_JSON=""
            for ATTEMPT in 1 2 3; do
              REL_JSON=$(curl -s --fail --max-time 30 \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/LyraVoid/FinaSU/releases/latest") \
                && [ -n "$REL_JSON" ] && break
              echo "Failed to get Release information，retry ($ATTEMPT/3)..."
              REL_JSON=""
              sleep 5
            done
            if [ -z "$REL_JSON" ]; then
              echo "::warning::Unable to get the latest FinaSU Release information; skipping manager and certificate alignment for this run (kernel follows master)"
              echo "ksuCommit=" >> $GITHUB_OUTPUT
              exit 0
            fi
            REL_TAG=$(printf '%s' "$REL_JSON" | jq -r '.tag_name')
            REL_APK_URL=$(printf '%s' "$REL_JSON" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n1)
            if [ -z "$REL_APK_URL" ] || [ "$REL_APK_URL" = "null" ]; then
              echo "::warning::Release $REL_TAG has no APK asset; skipping manager and certificate alignment for this run"
              echo "ksuCommit=" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Download Release manager: $REL_TAG"
            REL_APK="manager-artifacts/$(basename "$REL_APK_URL")"
            if ! curl -sL --fail --retry 3 --max-time 300 -o "$REL_APK" "$REL_APK_URL"; then
              echo "::warning::Failed to download the Release manager; skipping manager and certificate alignment for this run"
              echo "ksuCommit=" >> $GITHUB_OUTPUT
              exit 0
            fi
            CLEAN_NAME=$(basename "$REL_APK" | sed -E 's/-(arm64-v8a|armeabi-v7a|armv7|riscv64|x86_64|x86|universal)-release\.apk$/.apk/')
            MANAGER_VERSION=$(echo "$CLEAN_NAME" | grep -oE '_[0-9]+' | tail -n 1 | tr -d '_')
            if ! [[ "${MANAGER_VERSION:-}" =~ ^[0-9]+$ ]]; then
              echo "::warning::Unable to parse the version from the Release APK filename ($(basename "$REL_APK")); skipping manager and certificate alignment for this run"
              echo "ksuCommit=" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Extract signing certificate from Release manager APK..."
            CERT_INFO=$(python3 "$GITHUB_WORKSPACE/scripts/finasu_compat/extract_manager_cert.py" "$REL_APK" | head -n1)
            if [ -z "$CERT_INFO" ]; then
              echo "::warning::Failed to extract the signing certificate from the Release manager APK; the kernel will fall back to extracting it from the Release APK"
              echo "ksuCommit=" >> $GITHUB_OUTPUT
              exit 0
            fi
            CERT_SIZE=$(echo "$CERT_INFO" | awk '{print $1}')
            CERT_HASH=$(echo "$CERT_INFO" | awk '{print $2}')
            echo "Release: $REL_TAG, manager version $MANAGER_VERSION, certificate size=$CERT_SIZE sha256=$CERT_HASH"
            echo "MANAGER_VERSION=$MANAGER_VERSION" >> $GITHUB_ENV
            echo "managerVer=$MANAGER_VERSION" >> $GITHUB_OUTPUT
            echo "managerCertSize=$CERT_SIZE" >> $GITHUB_OUTPUT
            echo "managerCertHash=$CERT_HASH" >> $GITHUB_OUTPUT
            # Latest: pin to master HEAD (build the kernel at that commit); official: pin to the Release tag commit
            if [ "${PIN_MODE:-pin}" = "head" ]; then
              FINASU_REF=$(git -C KernelSU rev-parse "origin/master^{commit}" 2>/dev/null \
                || git ls-remote https://github.com/LyraVoid/FinaSU.git refs/heads/master 2>/dev/null | awk '{print $1}')
            else
              FINASU_REF=$(git -C KernelSU rev-parse "${REL_TAG}^{commit}" 2>/dev/null \
                || git ls-remote https://github.com/LyraVoid/FinaSU.git "refs/tags/${REL_TAG}^{}" 2>/dev/null | awk '{print $1}')
            fi
            echo "Kernel pinned commit: ${FINASU_REF:0:8}"
            echo "ksuCommit=$FINASU_REF" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ---------- SukiSU / BakaSU: Manager from official CI builds ----------
          get_manager_artifacts() {
            local artifacts="$1"
            if [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]; then
              printf '%s' "$artifacts" | jq -r \
                '.artifacts[] | select(.name == "Manager-release" or .name == "Spoofed-Manager-release") | "\(.name)\t\(.archive_download_url)"'
            else
              printf '%s' "$artifacts" | jq -r --arg needle "$KSUM" \
                '.artifacts[] | select((.name | ascii_downcase) | contains($needle)) | "\(.name)\t\(.archive_download_url)"'
            fi
          }

          # The version and manager versionCode share the same source (commit count + offset) and are used to select builds by version
          ksu_version_of() {
            case "$1" in
              SukiSU) echo $((40000 + $2 - 2815)) ;;
              BakaSU) echo $((30700 + $2)) ;;
              FinaSU) echo $((30000 + $2)) ;;
            esac
          }

          # Latest channel: first pin the default branch HEAD, then limit managers to builds whose version matches that HEAD,
          # to avoid version mismatches such as kernel 35249 / manager 35248
          HEAD_SHA=""
          HEAD_VERSION=""
          if [ "${PIN_MODE:-pin}" = "head" ]; then
            HEAD_SHA=$(git -C KernelSU rev-parse "origin/${EXPECTED_BRANCH}^{commit}" 2>/dev/null || true)
            if [ -z "$HEAD_SHA" ]; then
              HEAD_SHA=$(git ls-remote "https://github.com/$REPO.git" "refs/heads/$EXPECTED_BRANCH" 2>/dev/null | awk '{print $1}')
            fi
            if [ -n "$HEAD_SHA" ]; then
              git -C KernelSU cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null || git -C KernelSU fetch -q origin "$HEAD_SHA" 2>/dev/null || true
              HEAD_COUNT=$(git -C KernelSU rev-list --count "$HEAD_SHA" 2>/dev/null || echo "")
              if [ -n "$HEAD_COUNT" ]; then
                HEAD_VERSION=$(ksu_version_of "$VARIANT" "$HEAD_COUNT")
              fi
              echo "Latest channel: $EXPECTED_BRANCH HEAD ${HEAD_SHA:0:8} corresponding KSU version ${HEAD_VERSION:-unknown}"
            else
              echo "::warning::Unable to resolve $EXPECTED_BRANCH HEAD; selecting the latest manager build"
            fi
          fi

          # Following BakaSU_CI: fetch only the latest uploaded (push) Manager build from the official default branch,
          # and name it using the measured versionCode from the downloaded APK filename to ensure the package name matches its contents
          # Note: the runs list API sorting/cache is unreliable for some repositories (it may miss the latest build),
          # the created-date filter uses a reliable query path, so search backward from today in date windows
          FILENAME="build-manager.yml"
          RUNS_BASE="https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?status=success"
          CAND_FILE=$(mktemp)
          TODAY=$(date -u +%Y-%m-%d)

          for DAYS in 0 7 30 90 365; do
            if [ "$DAYS" -eq 0 ]; then
              FROM="$TODAY"
            else
              FROM=$(date -u -d "today - $DAYS days" +%Y-%m-%d)
            fi
            echo "Searching $FROM ~ $TODAY during Manager build..."
            for PAGE in 1 2 3; do
              RUNS=""
              for ATTEMPT in 1 2 3; do
                RUNS=$(curl -s --fail --max-time 30 -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  "$RUNS_BASE&created=$FROM..$TODAY&per_page=30&page=$PAGE") && [ -n "$RUNS" ] && break
                echo "Failed to query the build list; retrying ($ATTEMPT/3)..."
                RUNS=""
                sleep 3
              done
              RUN_COUNT=$(printf '%s' "$RUNS" | jq '.workflow_runs | length')
              if [ "$RUN_COUNT" -eq 0 ]; then
                break
              fi
              for INDEX in $(seq 0 $((RUN_COUNT - 1))); do
                BUILD_ID=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].id")
                CAND_SHA=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_sha")
                CAND_BRANCH=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_branch")
                EVENT=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].event")
                CREATED=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].created_at")
                # Official channel: accept only builds uploaded from the official default branch (push and workflow_dispatch are both allowed,
                # manual triggers are often used for testing before an official upload); skip PR and other branch builds
                #(main for SukiSU/BakaSU; master for FinaSU)
                # Latest channel: accept builds from any branch (skip PR builds), then sort by version match with HEAD
                if [ "${PIN_MODE:-pin}" = "head" ]; then
                  if [ "$EVENT" != "push" ] && [ "$EVENT" != "workflow_dispatch" ]; then
                    echo "Skipping build $BUILD_ID ($CAND_BRANCH/$EVENT): not a push/manual-triggered build"
                    continue
                  fi
                elif [ "$CAND_BRANCH" != "$EXPECTED_BRANCH" ] || { [ "$EVENT" != "push" ] && [ "$EVENT" != "workflow_dispatch" ]; }; then
                  echo "Skipping build $BUILD_ID ($CAND_BRANCH/$EVENT): not the official $EXPECTED_BRANCH branch build"
                  continue
                fi
                printf '%s\t%s\t%s\t%s\n' "$CREATED" "$BUILD_ID" "$CAND_SHA" "$CAND_BRANCH" >> "$CAND_FILE"
              done
            done
            if [ -s "$CAND_FILE" ]; then
              break
            fi
          done

          if [ ! -s "$CAND_FILE" ]; then
            rm -f "$CAND_FILE"
            echo "No usable Manager build found."
            echo "ksuCommit=" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Deduplicate, then sort:
          #   official → default-branch builds in reverse chronological order
          #   latest → prefer builds whose version matches HEAD, then default-branch builds, then other branches (each group in reverse chronological order)
          CAND_UNIQ=$(mktemp)
          sort -u -t$'\t' -k2,2 "$CAND_FILE" > "$CAND_UNIQ"
          rm -f "$CAND_FILE"

          PREF_SHA=""
          if [ "${PIN_MODE:-pin}" = "head" ] && [ -n "$HEAD_VERSION" ]; then
            while IFS=$'\t' read -r CREATED BUILD_ID CAND_SHA CAND_BRANCH; do
              if [ "$CAND_SHA" = "$HEAD_SHA" ]; then
                PREF_SHA="$CAND_SHA"
                break
              fi
              git -C KernelSU cat-file -e "${CAND_SHA}^{commit}" 2>/dev/null \
                || git -C KernelSU fetch -q origin "$CAND_SHA" 2>/dev/null \
                || continue
              CAND_COUNT=$(git -C KernelSU rev-list --count "$CAND_SHA" 2>/dev/null || echo "")
              [ -n "$CAND_COUNT" ] || continue
              if [ "$(ksu_version_of "$VARIANT" "$CAND_COUNT")" = "$HEAD_VERSION" ]; then
                PREF_SHA="$CAND_SHA"
                break
              fi
            done < <(sort -t$'\t' -k1,1r "$CAND_UNIQ" | head -n 40)
            if [ -n "$PREF_SHA" ]; then
              echo "Prefer the build commit matching HEAD version $HEAD_VERSION ${PREF_SHA:0:8}"
            fi
          fi

          ORDERED_FILE=$(mktemp)
          # Candidate row format: creation time \t build ID \t commit \t branch (priority is added in column 1 by awk)
          sort -t$'\t' -k1,1r "$CAND_UNIQ" \
            | awk -F'\t' -v pref="$PREF_SHA" -v br="$EXPECTED_BRANCH" \
                '{ p = (pref != "" && $3 == pref) ? 0 : ($4 == br ? 1 : 2); print p "\t" $0 }' \
            | sort -t$'\t' -k1,1n -k2,2r > "$ORDERED_FILE"
          rm -f "$CAND_UNIQ"

          CAND_COUNT=$(wc -l < "$ORDERED_FILE")
          echo "Found $CAND_COUNT usable builds; trying them in priority order (using the measured version from the APK filename)..."

          MANAGER_VERSION=""
          MANAGER_BUILD_ID=""
          MANAGER_HEAD_SHA=""
          MANAGER_BRANCH=""
          while IFS=$'\t' read -r PRIO CREATED BUILD_ID CAND_SHA CAND_BRANCH; do
            ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/$REPO/actions/runs/$BUILD_ID/artifacts")
            CANDIDATE_LIST=$(get_manager_artifacts "$ARTIFACTS")
            if [ -z "$CANDIDATE_LIST" ]; then
              echo "Skipping build $BUILD_ID ($CAND_BRANCH, $CREATED): No artifact containing '$KSUM' found"
              continue
            fi

            echo "Download build $BUILD_ID ($CAND_BRANCH, $CREATED, ${CAND_SHA:0:8}) found..."
            rm -rf manager-artifacts
            mkdir -p manager-artifacts
            while IFS=$'\t' read -r NAME URL; do
              SAFE_NAME=$(echo "$NAME" | tr '/ ' '__')
              if ! curl -sL --fail -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -o "manager-artifacts/$SAFE_NAME.zip" "$URL"; then
                echo "download $NAME failed"
                continue
              fi
              mkdir -p "manager-artifacts/$SAFE_NAME"
              unzip -oq "manager-artifacts/$SAFE_NAME.zip" -d "manager-artifacts/$SAFE_NAME" || echo "Failed to extract $NAME"
              rm -f "manager-artifacts/$SAFE_NAME.zip"
            done <<< "$CANDIDATE_LIST"

            # Extract the measured versionCode from the APK filename for artifact naming
            # Prefer the arm64-v8a release (BakaSU downstream keeps only this ABI)
            APK_FILE=$(find manager-artifacts -type f -name "*-arm64-v8a-release.apk" | head -n 1)
            if [ -z "$APK_FILE" ]; then
              APK_FILE=$(find manager-artifacts -type f -name "*release.apk" ! -name "*debug*" | head -n 1)
            fi
            if [ -z "$APK_FILE" ]; then
              echo "Skipping build $BUILD_ID ($CAND_BRANCH, $CREATED): no release APK in artifact"
              continue
            fi
            # Strip the ABI segment before extracting the version so numeric suffixes such as "_64" in x86_64 are not mistaken for the versionCode
            CLEAN_NAME=$(basename "$APK_FILE" | sed -E 's/-(arm64-v8a|armeabi-v7a|armv7|riscv64|x86_64|x86|universal)-release\.apk$/.apk/')
            ACTUAL_VERSION=$(echo "$CLEAN_NAME" | grep -oE '_[0-9]+' | tail -n 1 | tr -d '_')
            if ! [[ "$ACTUAL_VERSION" =~ ^[0-9]+$ ]]; then
              echo "Skipping build $BUILD_ID ($CAND_BRANCH, $CREATED): Unable to parse version from APK filename ($(basename "$APK_FILE"))"
              continue
            fi

            MANAGER_VERSION="$ACTUAL_VERSION"
            MANAGER_BUILD_ID="$BUILD_ID"
            MANAGER_HEAD_SHA="$CAND_SHA"
            MANAGER_BRANCH="$CAND_BRANCH"
            break
          done < "$ORDERED_FILE"
          rm -f "$ORDERED_FILE"

          if [ -z "$MANAGER_VERSION" ]; then
            echo "No usable Manager artifact was found."
            echo "ksuCommit=" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "select Manager build $MANAGER_BUILD_ID ($MANAGER_BRANCH, ${MANAGER_HEAD_SHA:0:8}), APK measured version $MANAGER_VERSION"
          # Kernel commit pinning strategy:
          #   official → pin to that build commit (version exactly matches the manager)
          #   latest → pin to the default branch HEAD at selection time (the manager was matched to that version)
          PIN_COUNT=$(git -C KernelSU rev-list --count "$MANAGER_HEAD_SHA" 2>/dev/null || echo "")
          if [ -n "$PIN_COUNT" ]; then
            case "$VARIANT" in
              BakaSU) PINNED_KSU_VERSION=$((30700 + PIN_COUNT)) ;;
              SukiSU) PINNED_KSU_VERSION=$((40000 + PIN_COUNT - 2815)) ;;
              FinaSU) PINNED_KSU_VERSION=$((30000 + PIN_COUNT)) ;;
              *)      PINNED_KSU_VERSION="" ;;
            esac
            if [ -n "$PINNED_KSU_VERSION" ]; then
              echo "Manager build commit ${MANAGER_HEAD_SHA:0:8} corresponds to KSU version: $PINNED_KSU_VERSION"
              if [ "$MANAGER_VERSION" != "$PINNED_KSU_VERSION" ]; then
                echo "::warning::Manager measured version $MANAGER_VERSION does not match the KSU version $PINNED_KSU_VERSION for the build commit"
              fi
            elif [ -n "${KSU_VERSION:-}" ] && [ "$MANAGER_VERSION" != "$KSU_VERSION" ]; then
              echo "::warning::Manager measured version $MANAGER_VERSION does not match kernel KSU version ${KSU_VERSION}"
            fi
          elif [ -n "${KSU_VERSION:-}" ] && [ "$MANAGER_VERSION" != "$KSU_VERSION" ]; then
            echo "::warning::Manager measured version $MANAGER_VERSION does not match kernel KSU version ${KSU_VERSION} (unable to calculate the version for the build commit)"
          fi
          echo "MANAGER_VERSION=$MANAGER_VERSION" >> $GITHUB_ENV
          echo "managerVer=$MANAGER_VERSION" >> $GITHUB_OUTPUT

          if [ "${PIN_MODE:-pin}" = "head" ] && [ -n "$HEAD_SHA" ]; then
            if [ -n "$HEAD_VERSION" ] && [ "$MANAGER_VERSION" != "$HEAD_VERSION" ]; then
              echo "::warning::Latest channel: No manager matching $EXPECTED_BRANCH HEAD version $HEAD_VERSION found; falling back to $MANAGER_VERSION"
            fi
            echo "Latest channel: kernel pinned to $EXPECTED_BRANCH HEAD ${HEAD_SHA:0:8}，manager version $MANAGER_VERSION"
            echo "ksuCommit=$HEAD_SHA" >> $GITHUB_OUTPUT
          else
            echo "kernel pinned tobuildcommit ${MANAGER_HEAD_SHA:0:8}，manager version $MANAGER_VERSION"
            echo "ksuCommit=$MANAGER_HEAD_SHA" >> $GITHUB_OUTPUT
          fi

          if [ "$VARIANT" == "BakaSU" ]; then
            echo "Keep only the BakaSU arm64-v8a release manager..."
            find manager-artifacts -type f -name "*.apk" ! -name "*-arm64-v8a-release.apk" -delete
            find manager-artifacts -type f -name "*debug*.apk" -delete
            if ! find manager-artifacts -type f -name "*-arm64-v8a-release.apk" | grep -q .; then
              echo "not found BakaSU arm64-v8a release manager。"
              exit 1
            fi
            find manager-artifacts -type f -name "*.apk" -print
          fi

      - name: Add SUSFS module
        id: add_SUSFS
        continue-on-error: true
        run: |
          # All upstream susfs4ksu-module Actions artifacts have expired,
          # the module is now published via GitHub Releases; fetch the latest Release asset instead
          RELEASE_API="https://api.github.com/repos/sidex15/susfs4ksu-module/releases/latest"
          RELEASE_JSON=""
          for ATTEMPT in 1 2 3; do
            RELEASE_JSON=$(curl -s --fail --max-time 30 \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$RELEASE_API") \
              && [ -n "$RELEASE_JSON" ] && break
            echo "Failed to get Release information，retry ($ATTEMPT/3)..."
            sleep 5
          done
          if [ -z "$RELEASE_JSON" ]; then
            echo "Unable to get the latest Release information for susfs4ksu-module"
            exit 1
          fi

          TAG_NAME=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')
          ASSET_URL=$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select((.name | contains("ksu_module_susfs")) and (.name | endswith(".zip"))) | .browser_download_url' | head -n 1)

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "No ksu_module_susfs module zip found in Release $TAG_NAME"
            exit 1
          fi

          NAME="ksu_module_susfs.zip"
          echo "Download SUSFS module: $NAME (Release $TAG_NAME)"
          if ! curl -sL --fail --retry 3 --max-time 120 -o "$NAME" "$ASSET_URL"; then
            echo "Failed to download SUSFS module: $ASSET_URL"
            exit 1
          fi
          echo "SUSFS_NAME=$TAG_NAME" >> $GITHUB_ENV

          # The Release asset is already a complete module zip; verify it and place it directly in the module directory
          if ! unzip -t "$NAME" >/dev/null 2>&1; then
            echo "Downloaded SUSFS module zip is corrupt"
            exit 1
          fi
          mkdir -p susfs-module
          mv "$NAME" "susfs-module/$NAME"
          ls -la susfs-module/

      - name: Notify on failure
        if: steps.add_KSU.outcome == 'failure'
        run: echo "Failed to download KSU from the CI build!"

      - name: Build channel summary
        if: always()
        run: |
          {
            echo "### Build channel"
            echo ""
            echo "- Selected channel：${{ inputs.build_channel }}"
            echo "- Actual channel：${CHANNEL_KIND:-unknown}（pin_mode=${PIN_MODE:-unknown}）"
            echo "- manager source：${MANAGER_SOURCE:-ci}"
            if [ "${MANAGER_SOURCE:-ci}" = "release" ]; then
              echo "- Release Tag：${REL_TAG:-unknown}"
              echo "- Kernel alignment commit: ${REL_COMMIT:0:8}"
            elif [ "${CHANNEL_KIND:-}" = "latest" ]; then
              echo "- kernel pinned to：upstreamdefault branch HEAD ${HEAD_SHA:0:8}（manager is matched to that version）"
            else
              echo "- kernel pinned to：official default branchlatestuploadbuild${MANAGER_HEAD_SHA:+ }${MANAGER_HEAD_SHA:0:8}"
            fi
            echo "- manager version：${{ steps.add_KSU.outputs.managerVer }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: uploadAPK
        if: steps.add_KSU.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.kernelsu_variant }}-Manager(${{ env.MANAGER_VERSION }})
          path: |
            manager-artifacts/**/*.apk

      - name: Upload SUSFS module
        if: steps.add_SUSFS.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: ./susfs-module/*
