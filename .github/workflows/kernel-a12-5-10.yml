name: Kernel build - Android 12 (5.10)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "KernelSU variant"
        required: true
        type: choice
        options:
          - SukiSU
          - BakaSU
          - FinaSU
        default: FinaSU
      build_channel:
        description: "Build channel (official = official Release; latest = latest upstream commit)"
        required: false
        type: choice
        options:
          - "Official (Release)"
          - "Latest (HEAD)"
        default: "Official (Release)"
      version:
        description: "Custom version name (optional)"
        required: false
        type: string
      build_time:
        description: "Custom build time (leave blank to use the current Beijing time automatically; example: Tue Dec  1 08:10:00 UTC 2026)"
        required: false
        type: string
        default: ""
      use_kpm:
        description: "KPM feature (supported by SukiSU only)"
        required: true
        type: choice
        default: "disabled (off)"
        options:
          - "disabled (off)"
          - "enabled (on)"
          - "patched (on with patch)"
      droidspaces:
        description: "Droidspaces container support"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "Build artifact upload mode"
        required: true
        type: choice
        options:
          - "Upload AnyKernel3.zip only"
          - "Upload all"
        default: "Upload AnyKernel3.zip only"
      droidspaces_ntsync:
        description: "Enable NTSync support for the Droidspaces container (requires Droidspaces)"
        required: false
        type: boolean
        default: false
      use_zram:
        description: "Enable the ZRAM compression algorithm"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG baseband protection"
        required: true
        type: boolean
        default: false
      use_net_enhance:
        description: "Enable network enhancements (BBRv3 + IPSet + Qdisc + CIFS)"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "Enable the Re-Kernel driver"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply the CVE-2026-43499 rtmutex fix series"
        required: false
        type: boolean
        default: false
      cancel_susfs:
        description: "Disable SUSFS"
        required: true
        type: boolean
        default: false
      skip_incompatible:
        description: "Automatically skip features that are incompatible or unavailable (without interrupting the build)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      build_channel:
        description: "Build channel (passed from main.yml; when triggered directly, use the source of the manager fetched by this workflow)"
        required: false
        type: string
        default: "Official (Release)"
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: ""
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_net_enhance:
        required: true
        type: boolean
        default: false
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      cancel_susfs:
        required: false
        type: boolean
      droidspaces:
        required: false
        type: string
        default: "off"
      artifact_upload_mode:
        required: false
        type: string
        default: "Upload all"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      skip_incompatible:
        required: false
        type: boolean
        default: false
      called_from_main:
        description: "Whether called from main.yml (internal use)"
        required: false
        type: boolean
        default: false
      ksu_commit:
        description: "KernelSU commit from the latest official uploaded build (passed from main.yml; when triggered directly, automatically use the manager build fetched by this workflow)"
        required: false
        type: string
        default: ""

      ksu_cert_size:
        description: "FinaSU manager signing certificate DER size (passed from main.yml; when triggered directly, automatically use the certificate from the manager fetched by this workflow)"
        required: false
        type: string
        default: ""

      ksu_cert_hash:
        description: "FinaSU manager signing certificate SHA256 (passed from main.yml; when triggered directly, automatically use the certificate from the manager fetched by this workflow)"
        required: false
        type: string
        default: ""

jobs:
  build-kernels-a12-5-10:
    name: "5.10.${{ matrix.display_sub || matrix.sub_level }}-${{ matrix.os_patch_level }}"
    needs: get-ksu-manager
    # The build is not blocked if the manager job is skipped (called_from_main) or fails; if ksuCommit is empty, fall back to the passed value or main HEAD
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sub_level: "43"
            os_patch_level: "2021-10"
            revision: "r1"
          - sub_level: "66"
            os_patch_level: "2022-01"
            revision: "r11"
          - sub_level: "81"
            os_patch_level: "2022-03"
            revision: "r11"
          - sub_level: "101"
            os_patch_level: "2022-04"
            revision: "r28"
          - sub_level: "110"
            os_patch_level: "2022-07"
            revision: "r1"
          - sub_level: "117"
            os_patch_level: "2022-09"
            revision: "r1"
          - sub_level: "136"
            os_patch_level: "2022-11"
            revision: "r15"
          - sub_level: "149"
            os_patch_level: "2023-01"
            revision: "r1"
          - sub_level: "160"
            os_patch_level: "2023-03"
            revision: "r1"
          - sub_level: "168"
            os_patch_level: "2023-04"
            revision: "r9"
          - sub_level: "177"
            os_patch_level: "2023-07"
            revision: "r3"
          - sub_level: "185"
            os_patch_level: "2023-09"
            revision: "r1"
          - sub_level: "198"
            os_patch_level: "2024-01"
            revision: "r17"
          - sub_level: "205"
            os_patch_level: "2024-03"
            revision: "r1"
          - sub_level: "209"
            os_patch_level: "2024-05"
            revision: "r13"
          - sub_level: "218"
            os_patch_level: "2024-08"
            revision: "r14"
          - sub_level: "226"
            os_patch_level: "2024-11"
            revision: "r8"
          - sub_level: "233"
            os_patch_level: "2025-02"
            revision: "r1"
          - sub_level: "236"
            os_patch_level: "2025-05"
            revision: "r1"
          - sub_level: "237"
            os_patch_level: "2025-06"
            revision: "r1"
          - sub_level: "240"
            os_patch_level: "2025-09"
            revision: "r1"
          - sub_level: "246"
            os_patch_level: "2025-12"
            revision: "r1"
          - sub_level: "X"
            os_patch_level: "lts"
            revision: "r1"
            display_sub: "272"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android12"
      kernel_version: "5.10"
      sub_level: ${{ matrix.sub_level }}
      display_sub: ${{ matrix.display_sub || '' }}
      os_patch_level: ${{ matrix.os_patch_level }}
      revision: ${{ matrix.revision }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      ksu_commit: ${{ inputs.ksu_commit || needs.get-ksu-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ inputs.ksu_cert_size || needs.get-ksu-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ inputs.ksu_cert_hash || needs.get-ksu-manager.outputs.managerCertHash }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: false
      enable_susfs: ${{ !inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}

  # Run only when triggered directly; skip when called from main.yml
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
