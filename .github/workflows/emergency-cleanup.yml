name: Emergency Release Cleanup

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Target release tag (Target Release Tag)'
        required: true
        type: string
      issue_type:
        description: 'Issue type (Issue Type)'
        required: true
        type: choice
        options:
          - Normal
          - Bug
          - Critical
      reference:
        description: 'Issue link or description (Issue link or description, optional)'
        required: false
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Only repository owners may run this workflow
    if: github.actor == github.repository_owner

    steps:
      # ==================== Verify that the release exists ====================
      - name: Verify release exists
        run: |
          if ! gh release view "${{ inputs.target_tag }}" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "::error::Release '${{ inputs.target_tag }}' does not exist"
            exit 1
          fi
          echo "✅ Found release: ${{ inputs.target_tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==================== Get original release information ====================
      - name: Get original release information
        id: info
        run: |
          gh release view "${{ inputs.target_tag }}" --repo ${{ github.repository }} \
            --json name,body,isPrerelease > release_info.json

          jq -r '.name' release_info.json > original_title.txt
          jq -r '.body' release_info.json > original_body.txt

          IS_PRERELEASE=$(jq -r '.isPrerelease' release_info.json)
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

          echo "📋 Original title: $(cat original_title.txt)"
          echo "📋 Pre-release: $IS_PRERELEASE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==================== Handle Normal type ====================
      - name: Handle Normal type - Mark as normal
        if: inputs.issue_type == 'Normal'
        run: |
          cat > new_body.md << 'EOF'
          > [!TIP]
          > **This version has been verified and is safe to use.**
          >
          > **This release has been verified and is safe to use.**
          EOF

          sed -i 's/^          //' new_body.md

          if [ -n "${{ inputs.reference }}" ]; then
            echo "" >> new_body.md
            echo "**Reference**: ${{ inputs.reference }}" >> new_body.md
          fi

          echo "" >> new_body.md
          echo "---" >> new_body.md
          echo "" >> new_body.md
          cat original_body.txt >> new_body.md

          gh release edit "${{ inputs.target_tag }}" --repo ${{ github.repository }} \
            --notes-file new_body.md

          echo "✅ Release marked as normal (Normal)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==================== Handle Bug type ====================
      - name: Handle Bug type
        if: inputs.issue_type == 'Bug'
        run: |
          cat > new_body.md << 'EOF'
          > [!WARNING]
          > **This version has known bugs; use with caution.**
          >
          > **This release contains known bugs, use with caution.**
          EOF

          sed -i 's/^          //' new_body.md

          if [ -n "${{ inputs.reference }}" ]; then
            echo "" >> new_body.md
            echo "**Reference**: ${{ inputs.reference }}" >> new_body.md
          fi

          echo "" >> new_body.md
          echo "---" >> new_body.md
          echo "" >> new_body.md
          cat original_body.txt >> new_body.md

          gh release edit "${{ inputs.target_tag }}" --repo ${{ github.repository }} \
            --notes-file new_body.md

          echo "✅ Release description updated (Bug)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==================== Handle Critical type ====================
      - name: Handle Critical type - Delete and recreate
        if: inputs.issue_type == 'Critical'
        run: |
          ORIGINAL_TITLE=$(cat original_title.txt)

          # Build warning information
          cat > new_body.md << 'EOF'
          > [!CAUTION]
          > **This release contains a severe bug that causes device crashes; all assets have been removed!**
          >
          > **Do not use this version; wait for a fixed release.**
          >
          > **This release contained a critical bug causing device crashes. All assets have been removed!**
          >
          > **DO NOT use this version. Please wait for a fixed release.**
          EOF

          sed -i 's/^          //' new_body.md

          if [ -n "${{ inputs.reference }}" ]; then
            echo "" >> new_body.md
            echo "**Reference**: ${{ inputs.reference }}" >> new_body.md
          fi

          echo "" >> new_body.md
          echo "---" >> new_body.md
          echo "" >> new_body.md
          cat original_body.txt >> new_body.md

          # Delete Release (keep the Git tag)
          echo "🗑️ Delete original Release..."
          gh release delete "${{ inputs.target_tag }}" --repo ${{ github.repository }} --yes

          # Determine prerelease flag
          PRERELEASE_FLAG=""
          if [ "${{ steps.info.outputs.is_prerelease }}" == "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Recreate Release (do not upload any files)
          echo "🔄 Recreate Release..."
          gh release create "${{ inputs.target_tag }}" --repo ${{ github.repository }} \
            --title "$ORIGINAL_TITLE" \
            --notes-file new_body.md \
            $PRERELEASE_FLAG

          echo "✅ All assets removed and Release recreated (Critical)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==================== Completion notification ====================
      - name: Complete
        run: |
          echo "=========================================="
          echo "🎯 Target tag: ${{ inputs.target_tag }}"
          echo "📌 Issue type: ${{ inputs.issue_type }}"
          echo "📝 Reference information: ${{ inputs.reference || 'none' }}"
          echo "=========================================="
          echo "✅ Emergency cleanup complete!"
